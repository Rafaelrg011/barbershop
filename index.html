function navigate(v){if(!allowed().includes(v))return;view=v;search='';render()}
function base_render(){if(!allowed().includes(view))view='Agenda';$('#nav').innerHTML=allowed().map(n=>`<button class="${view===n?'active':''}" onclick="navigate('${n}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${icons[n]}"/></svg>${n}</button>`).join('');$('#crumb').textContent=view;$('#roleLabel').textContent=role;({Agenda:agenda,Clientes:clientPage,Servicios:servicePage,Caja:cashPage,Afluencia:heatPage,Promociones:promoPage,Equipo:teamPage,Configuración:setupPage,Estadísticas:statsPage,Inventario:inventoryPage,Comisiones:commissionPage}[view])()}
function heading(title,sub,action=''){return `<div class="pagehead"><div><span class="eyebrow">TU BARBERÍA, EN ORDEN</span><h1>${title}</h1><p class="muted">${sub}</p></div>${action}</div>`}
function stat(label,value,detail){return `<div class="stat"><label>${label}</label><strong>${value}</strong><small>${detail}</small></div>`}
function name(a){return clients.find(c=>c.id===a.client)?.name||'Cliente'}
function minutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}function clock(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function changeDay(n){const d=new Date(day+'T12:00:00');d.setDate(d.getDate()+n);day=d.toISOString().slice(0,10);render()}
function field(label,content){return `<label class="field">${label}${content}</label>`}function input(n,type='text',value='',extra=''){return `<input name="${n}" type="${type}" value="${esc(value)}" ${extra}>`}
function closeModal(){$('#modal').close()}
function finish(msg){closeModal();render();notify(msg)}
function clientPage(){const rows=clients.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())||c.phone.includes(search));$('#main').innerHTML=heading('Clientes','Cada visita, una relación que crece.','<button class="primary" onclick="clientForm()">＋ Nuevo cliente</button>')+`<section class="panel"><div class="panelhead"><h2>${clients.length} clientes</h2><input type="search" aria-label="Buscar cliente" placeholder="Buscar nombre o teléfono" value="${esc(search)}" oninput="search=this.value;clientRows()" id="clientSearch"></div><div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Teléfono</th><th>Atenciones</th><th>Próxima cita</th></tr></thead><tbody id="clientRows"></tbody></table></div></section>`;clientRows()}
$('#role').onchange=e=>{role=e.target.value;filter='Todos';render()};$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});window.addEventListener('offline',()=>notify('Sin conexión. Los cambios permanecen en esta sesión; la sincronización no está conectada.'));
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'navigate_barber_demo',description:'Abre una sección disponible en la vista de demostración actual; no crea registros.',inputSchema:{type:'object',properties:{section:{type:'string',enum:['Agenda','Clientes','Servicios','Caja','Estadísticas','Afluencia','Promociones','Inventario','Comisiones','Equipo','Configuración']}},required:['section'],additionalProperties:false},execute(input){if(!input||!allowed().includes(input.section))throw Error('Sección no disponible');navigate(input.section);return {section:view,demo:true}}})).catch(()=>{})}catch{}}
// Version 2: richer workflows, still explicitly a demonstration until backend activation.
let calendarMode='day',statusFilter='Todas',historyLog=[],reportFrom=today,reportTo=today,heatMode='attended';
let schedules=barbers.map(()=>({start:'09:00',end:'18:00',breakStart:'13:00',breakEnd:'14:00',days:[1,2,3,4,5,6],active:true}));
let cashSessions=[],currentCashId=null;
services.forEach(s=>{s.active=true;s.prep=0});
appointments.forEach(a=>{a.serviceName=services[a.service].name;a.prep=0});
movements[0].appointment=1;movements[0].id=1;
function logAction(title,entity=null){historyLog.unshift({time:new Date().toISOString(),title,entity,role})}
function activeStaff(){return barbers.map((name,id)=>({name,id})).filter(b=>schedules[b.id].active)}
function dayOf(d){return new Date(d+'T12:00:00').getDay()}
function availableMinutes(d,b){return ranges(d,b).reduce((sum,[a,z])=>sum+z-a,0)}
function visible(){return appointments.filter(a=>a.date===day&&(role!=='Barbero'||a.barber===0)&&(filter==='Todos'||a.barber===+filter)&&(statusFilter==='Todas'||a.status===statusFilter))}
function agenda(){const list=visible(),scoped=agendaScope();const pending=scoped.filter(a=>!['Cancelada','No asistió'].includes(a.status)&&a.paid<a.price);$('#main').innerHTML=heading('La agenda de tu barbería',new Date(day+'T12:00:00').toLocaleDateString('es-BO',{weekday:'long',day:'numeric',month:'long'}),'<div class="buttons"><button onclick="clientForm()">Nuevo cliente</button><button class="primary" onclick="bookingForm()">＋ Nueva cita</button></div>')+`<div class="stats">${stat(calendarMode==='week'?'Citas de la semana':'Citas del día',scoped.length,'Período y equipo seleccionados · todos los estados')}${stat('En atención',scoped.filter(a=>a.status==='En servicio').length,'En servicio en el período seleccionado')}${stat('Por confirmar',scoped.filter(a=>a.status==='Pendiente').length,'Citas pendientes de confirmación')}${stat(role==='Barbero'?'Atenciones completadas':'Pendiente de cobrar',role==='Barbero'?scoped.filter(a=>a.status==='Completada').length:money(pending.reduce((n,a)=>n+a.price-a.paid,0)),role==='Barbero'?'Servicios finalizados':pending.length+' citas con saldo, incluidas reservas')}</div>${reminderBanner()}<div class="toolbar"><div class="segmented"><button class="${calendarMode==='day'?'selected':''}" onclick="calendarMode='day';render()">Día</button><button class="${calendarMode==='week'?'selected':''}" onclick="calendarMode='week';render()">Semana</button></div><div class="filters"><button onclick="changeDay(calendarMode==='week'?-7:-1)" aria-label="Anterior">‹</button><button onclick="day=today;render()">Hoy</button><input aria-label="Fecha" type="date" value="${day}" onchange="day=this.value||today;render()"><button onclick="changeDay(calendarMode==='week'?7:1)" aria-label="Siguiente">›</button></div></div><section class="panel"><div class="panelhead"><h2>${calendarMode==='day'?'Citas por profesional':'Tu semana de un vistazo'}</h2><div class="filters">${role!=='Barbero'?`<select aria-label="Barbero" onchange="filter=this.value;render()"><option value="Todos">Todo el equipo</option>${barbers.map((b,i)=>`<option value="${i}" ${filter===String(i)?'selected':''}>${esc(b)}</option>`).join('')}</select>`:''}<select aria-label="Estado de cita" onchange="statusFilter=this.value;render()">${['Todas','Pendiente','Confirmada','Cliente presente','En servicio','Completada','Cancelada','No asistió'].map(s=>`<option ${s===statusFilter?'selected':''}>${s}</option>`).join('')}</select></div></div>${calendarMode==='week'?weekBoard():`<div class="board" style="grid-template-columns:repeat(${role==='Barbero'||filter!=='Todos'?1:barbers.length},minmax(0,1fr))">${barbers.map((b,i)=>role==='Barbero'&&i!==0||filter!=='Todos'&&+filter!==i?'':`<div class="lane"><div class="barber"><span class="avatar">${esc(b.split(' ').map(n=>n[0]).join(''))}</span><div><b>${esc(b)}</b><small>${ranges(day,i).length? schedules[i].start+'–'+schedules[i].end:'Día libre'} · ${list.filter(a=>a.barber===i).length} citas</small></div></div>${list.filter(a=>a.barber===i).sort((a,b)=>a.time.localeCompare(b.time)).map(bookingCard).join('')||'<div class="empty">Agenda despejada<small>Las nuevas citas aparecerán aquí.</small></div>'}</div>`).join('')}</div>`}<div class="agendaBottom"><span>Las duraciones incluyen el tiempo de preparación configurado.</span><span>Hora de Bolivia · Bs</span></div></section>`}
function weekBoard(){const start=new Date(day+'T12:00:00');start.setDate(start.getDate()-((start.getDay()+6)%7));return '<div class="weekwrap"><div class="weekgrid">'+Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);const date=d.toISOString().slice(0,10);const items=appointments.filter(a=>a.date===date&&(role!=='Barbero'||a.barber===0)&&(filter==='Todos'||a.barber===+filter)&&(statusFilter==='Todas'||a.status===statusFilter));return `<div class="weekcol ${date===today?'current':''}"><button class="weekdate" onclick="day='${date}';calendarMode='day';render()">${d.toLocaleDateString('es-BO',{weekday:'short'})}<b>${d.getDate()}</b></button>${items.sort((a,b)=>a.time.localeCompare(b.time)).map(bookingCard).join('')||'<div class="empty">Sin citas</div>'}</div>`}).join('')+'</div></div>'}
function base_bookingCard(a){const next={'Pendiente':'Confirmar','Confirmada':'Llegó','Cliente presente':'Atender','En servicio':'Completar'};return `<article class="booking ${a.status==='En servicio'?'service':a.status==='Completada'?'done':['Cancelada','No asistió'].includes(a.status)?'cancelled':''}"><div class="time"><span>${a.time}–${clock(minutes(a.time)+a.duration+(a.prep||0))}</span><span class="badge">${a.status}</span></div><h3>${esc(name(a))}</h3><p>${esc(a.serviceName||services[a.service].name)} · ${a.duration} min${a.prep?' + '+a.prep+' preparación':''}${calendarMode==='week'?'<br>'+esc(barbers[a.barber]):''}</p><div class="bookingfoot"><b>${money(a.price)}</b><span>${next[a.status]?`<button onclick="advance(${a.id})">${next[a.status]}</button>`:a.status==='Completada'&&a.paid<a.price&&role!=='Barbero'?`<button onclick="paymentForm(${a.id})">Cobrar</button>`:a.paid>=a.price?'<span class="badge">Pagado</span>':''} <button aria-label="Detalles de ${esc(name(a))}" onclick="detail(${a.id})">•••</button></span></div></article>`}
function base_advance(id){const a=appointments.find(a=>a.id===id),next={'Pendiente':'Confirmada','Confirmada':'Cliente presente','Cliente presente':'En servicio','En servicio':'Completada'};if(next[a.status]){a.status=next[a.status];logAction('Estado: '+a.status,id)}render();notify(a.status==='Completada'?'Atención completada. Falta registrar el cobro si corresponde.':'Estado actualizado')}
function base_detail(id){const a=appointments.find(a=>a.id===id),c=clients.find(c=>c.id===a.client);const open=!['Completada','Cancelada','No asistió'].includes(a.status);modal('Detalle e historial',`<h3>${esc(name(a))}</h3><p class="muted">${esc(a.serviceName)} · ${esc(barbers[a.barber])}<br>${a.date} · ${a.time} · ${a.status}</p><div class="summarystrip"><span>Total: <b>${money(a.price)}</b></span><span>Saldo: <b>${money(a.price-a.paid)}</b></span></div><div class="buttons" style="margin:18px 0">${open?`<button type="button" onclick="closeModal();bookingForm(${id})">Editar / reprogramar</button>`:''}${c?.phone?`<button type="button" onclick="whatsapp(${id})">Preparar WhatsApp</button>`:''}<button type="button" onclick="closeModal();clientDetail(${a.client})">Ver cliente</button></div>${open?field('Acción',`<select name="action"><option value="none">Conservar cita</option><option>Cancelada</option><option>No asistió</option></select>`)+field('Motivo de cancelación o ausencia',input('reason','text','','maxlength="180"')):''}<div class="history">${historyLog.filter(l=>l.entity===id).map(l=>`<p><strong>${esc(l.title)}</strong>${new Date(l.time).toLocaleString('es-BO',{timeZone:'America/La_Paz'})} · ${l.role}</p>`).join('')||'<p>Registro inicial.</p>'}</div>`,f=>{const state=f.get('action');if(state&&state!=='none'){if(!f.get('reason').trim())throw Error('Escribe el motivo del cambio.');a.status=state;logAction(state+': '+f.get('reason'),id)}finish('Detalle guardado')})}
function whatsapp(id){const a=appointments.find(a=>a.id===id),c=clients.find(c=>c.id===a.client);let phone=c.phone.replace(/\D/g,'');if(phone.length===8)phone='591'+phone;if(phone.length<10||phone.length>15)return notify('Revisa el teléfono del cliente e incluye el código de país.');const msg=`Hola, ${c.name}. Te recordamos tu cita en Barbe shop el ${a.date} a las ${a.time}, con ${barbers[a.barber]}. Servicio: ${a.serviceName}. Precio: ${money(a.price)}. ¿Nos confirmas tu asistencia?`;const url='https://wa.me/'+phone+'?text='+encodeURIComponent(msg);window.open(url,'_blank','noopener,noreferrer');notify('Mensaje preparado. Abrir WhatsApp no confirma que se haya enviado.')}
function clientRows(){$('#clientRows').innerHTML=clients.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())||c.phone.includes(search)).map(c=>`<tr><td><button style="border:0;padding:0;text-align:left" onclick="clientDetail(${c.id})">${esc(c.name)}</button></td><td>${esc(c.phone)||'Sin registrar'}</td><td>${appointments.filter(a=>a.client===c.id&&a.status==='Completada').length}</td><td>${appointments.filter(a=>a.client===c.id&&['Confirmada','Pendiente'].includes(a.status)).map(a=>a.date+' · '+a.time).join(', ')||'Sin cita pendiente'}</td></tr>`).join('')||'<tr><td colspan="4">No hay coincidencias.</td></tr>'}
function clientForm(id=null){const old=clients.find(c=>c.id===id);modal(old?'Editar cliente':'Nuevo cliente',field('Nombre',input('name','text',old?.name||'','required maxlength="80"'))+field('Teléfono (opcional)',input('phone','tel',old?.phone||'','maxlength="20"'))+field('Preferencias de corte',`<textarea name="notes" maxlength="300">${esc(old?.notes||'')}</textarea>`)+`<label class="inlinecheck"><input type="checkbox" name="consent" ${old?.consent?'checked':''}>Aceptó recibir promociones</label><p class="formhint">Registra el consentimiento solo si el cliente lo otorgó. Los recordatorios de citas son independientes.</p>`,f=>{const n=f.get('name').trim(),p=f.get('phone').trim();if(!n)throw Error('Escribe el nombre.');if(clients.some(c=>c.id!==id&&(c.name.toLowerCase()===n.toLowerCase()||p&&c.phone.replace(/\D/g,'')===p.replace(/\D/g,''))))throw Error('Hay un posible duplicado con ese nombre o teléfono.');const data={name:n,phone:p,notes:f.get('notes').trim(),consent:f.has('consent')};if(old)Object.assign(old,data);else clients.push({id:uuidNumber(),...data});logAction(old?'Cliente editado':'Cliente creado');finish('Cliente guardado')})}
function clientDetail(id){const c=clients.find(c=>c.id===id);modal('Ficha del cliente',`<h3>${esc(c.name)}</h3><p class="muted">${esc(c.phone)||'Sin teléfono'}<br>${c.consent?'Acepta promociones':'Sin consentimiento promocional'}</p><p>${esc(c.notes)||'Sin preferencias registradas.'}</p><button type="button" onclick="closeModal();clientForm(${id})">Editar datos</button><h3 class="subhead">Historial de visitas</h3><div class="history">${appointments.filter(a=>a.client===id).sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<p><strong>${a.date} · ${esc(a.serviceName)}</strong>${a.status} · ${esc(barbers[a.barber])} · ${money(a.price)}</p>`).join('')||'<p>Todavía no hay visitas.</p>'}</div>`,()=>closeModal())}
function servicePage(){$('#main').innerHTML=heading('Servicios y precios','Define cada servicio una vez; las citas guardan su precio original.',role==='Propietario'?'<button class="primary" onclick="serviceForm()">＋ Nuevo servicio</button>':'')+`<div class="cards">${services.map((s,i)=>`<article class="card"><span class="badge">${s.active?'Activo':'Desactivado'}</span><h2 style="margin-top:17px">${esc(s.name)}</h2><strong class="price">${money(s.price)}</strong><p>${s.duration} minutos de atención<br>${s.prep||0} minutos de preparación</p>${role==='Propietario'?`<button onclick="serviceForm(${i})">Editar servicio</button>`:''}</article>`).join('')}</div>`}
function serviceForm(id=null){if(role!=='Propietario')return;const s=services[id];modal(s?'Editar servicio':'Nuevo servicio',field('Nombre',input('name','text',s?.name||'','required maxlength="80"'))+`<div class="two">${field('Precio (Bs)',input('price','number',s?.price??40,'required min="0" max="100000" step="0.01"'))}${field('Duración (min)',input('duration','number',s?.duration??30,'required min="5" max="480" step="5"'))}</div>`+field('Preparación después del servicio (min)',input('prep','number',s?.prep??0,'required min="0" max="60" step="5"'))+`<label class="inlinecheck"><input type="checkbox" name="active" ${!s||s.active?'checked':''}>Disponible para nuevas citas</label><p class="formhint">Las citas existentes conservan precio, nombre y duración. Este cambio se aplica a nuevas reservas.</p>`,f=>{const data={name:f.get('name').trim(),price:Math.round(+f.get('price')*100)/100,duration:+f.get('duration'),prep:+f.get('prep'),active:f.has('active')};if(!data.name||!Number.isFinite(data.price)||data.price<0||data.duration<5||data.duration>480||data.prep<0||data.prep>60)throw Error('Revisa los valores del servicio.');if(s)Object.assign(s,data);else services.push(data);logAction('Catálogo actualizado: '+data.name);finish('Servicio guardado')})}
function teamPage(){$('#main').innerHTML=heading('Equipo y horarios','Organiza la jornada de cada profesional.','<button class="primary" onclick="staffForm()">＋ Agregar barbero</button>')+`<div class="cards">${barbers.map((b,i)=>`<article class="card"><span class="avatar">${esc(b.split(' ').map(x=>x[0]).join(''))}</span><h2 style="margin-top:18px">${esc(b)}</h2><p>${schedules[i].active?'Activo':'Inactivo'} · ${schedules[i].start}–${schedules[i].end}<br>Descanso: ${schedules[i].breakStart}–${schedules[i].breakEnd}<br>${schedules[i].days.map(d=>['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d]).join(' · ')}</p><button onclick="staffForm(${i})">Editar horario</button></article>`).join('')}</div><div class="notice">Las cuentas individuales y los permisos del servidor están pendientes de conexión. Consulta su estado en Configuración.</div>`}
function base_staffForm(id=null){if(role!=='Propietario')return;const s=schedules[id]||{start:'09:00',end:'18:00',breakStart:'13:00',breakEnd:'14:00',days:[1,2,3,4,5,6],active:true};modal(id===null?'Nuevo barbero':'Editar profesional',field('Nombre',input('name','text',barbers[id]||'','required maxlength="80"'))+`<div class="two">${field('Entrada',input('start','time',s.start,'required'))}${field('Salida',input('end','time',s.end,'required'))}${field('Descanso desde',input('bs','time',s.breakStart,'required'))}${field('Descanso hasta',input('be','time',s.breakEnd,'required'))}</div><div class="daychecks">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" name="d${d}" ${s.days.includes(d)?'checked':''}>${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d]}</label>`).join('')}</div><label class="inlinecheck"><input type="checkbox" name="active" ${s.active?'checked':''}>Activo para nuevas citas</label><p class="formhint">No se permite dejar citas futuras fuera del horario. Reprográmalas primero.</p>`,f=>{const n=f.get('name').trim(),next={start:f.get('start'),end:f.get('end'),breakStart:f.get('bs'),breakEnd:f.get('be'),days:[0,1,2,3,4,5,6].filter(d=>f.has('d'+d)),active:f.has('active')};if(!n||next.start>=next.end||next.breakStart<next.start||next.breakEnd>next.end||next.breakStart>=next.breakEnd)throw Error('Revisa los horarios de jornada y descanso.');if(id!==null){const previous=schedules[id];schedules[id]=next;try{appointments.filter(a=>a.barber===id&&a.date>=today&&!['Completada','Cancelada','No asistió'].includes(a.status)).forEach(a=>validateBooking(a,a.id))}catch{ schedules[id]=previous;throw Error('Hay citas pendientes que quedarían fuera del horario. Reprográmalas antes.')}barbers[id]=n}else{barbers.push(n);schedules.push(next)}logAction('Horario actualizado: '+n);finish('Profesional guardado')})}
function reportDays(){if(!reportFrom||!reportTo||reportFrom>reportTo)return [];const out=[];let d=new Date(reportFrom+'T12:00:00');for(let n=0;d.toISOString().slice(0,10)<=reportTo&&n<366;n++){out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}return out}
function download(filename,content,mime){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function base_paymentForm(id){const a=appointments.find(a=>a.id===id);if(!cashOpen){notify('Abre la caja antes de registrar el cobro.');navigate('Caja');return}modal('Cobrar atención',`<h3>${esc(name(a))}</h3><p>Saldo: <b>${money(a.price-a.paid)}</b></p>`+field('Importe recibido (Bs)',input('amount','number',(a.price-a.paid).toFixed(2),'required min="0.01" step="0.01"'))+field('Método','<select name="method"><option>Efectivo</option><option>QR (registro manual)</option><option>Transferencia (registro manual)</option></select>')+'<p class="formhint">Puedes registrar un pago parcial. QR y transferencias requieren revisión manual.</p>',f=>{const amount=Math.round(+f.get('amount')*100)/100;if(!cashOpen||!Number.isFinite(amount)||amount<=0||amount>Math.round((a.price-a.paid)*100)/100)throw Error('El importe debe ser positivo y no superar el saldo.');a.paid=Math.round((a.paid+amount)*100)/100;movements.push({id:uuidNumber(),date:today,amount,type:f.get('method'),note:'Cobro · '+name(a),appointment:id,kind:a.status==='Completada'?'payment':'deposit',session:currentCashId});logAction('Pago de '+money(amount)+' · '+f.get('method'),id);finish('Pago registrado')})}

ey(s.diff)}</td><td>${esc(s.reason)||'Sin diferencia'}</td></tr>`).join('')}</tbody></table></div></section><div class="notice">Para registrar una seña, abre el detalle de una cita futura. Los pagos se suman una sola vez al saldo. Las devoluciones se registran como movimientos negativos y no borran el cobro original.</div>`}
function stock(id){return stockLedger.filter(m=>m.product===id).reduce((s,m)=>s+m.delta,0)}
function inventoryPage(){$('#main').innerHTML=heading('Inventario','Distingue ventas de productos, entradas y consumo interno.','<button class="primary" onclick="productForm()">＋ Nuevo producto</button>')+`<div class="cards">${inventory.map(p=>`<article class="card"><span class="badge ${stock(p.id)<=p.min?'pending':''}">${stock(p.id)<=p.min?'Reponer':'Disponible'}</span><h2 style="margin-top:15px">${esc(p.name)}</h2><strong class="price">${stock(p.id)} <small style="font-size:1rem">unidades</small></strong><p>${money(p.price)} por unidad · mínimo ${p.min}</p><button onclick="stockForm(${p.id})">Registrar movimiento</button></article>`).join('')}</div><h2 class="subhead">Historial de movimientos</h2><section class="panel"><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Movimiento</th><th>Cantidad</th><th>Motivo</th></tr></thead><tbody>${stockLedger.slice().reverse().slice(0,30).map(m=>`<tr><td>${m.date}</td><td>${esc(inventory.find(p=>p.id===m.product).name)}</td><td>${m.kind}</td><td>${m.delta>0?'+':''}${m.delta}</td><td>${esc(m.reason)}</td></tr>`).join('')}</tbody></table></div></section><p class="metrichelp">Las ventas generan un ingreso en la caja abierta. El consumo interno reduce existencias sin generar una venta. Los ajustes requieren motivo. No se calcula costo de ventas ni utilidad.</p>`}
function productForm(){modal('Nuevo producto',field('Nombre',input('name','text','','required maxlength="80"'))+field('Precio de venta (Bs)',input('price','number',0,'required min="0" step="0.01"'))+field('Mínimo de reposición',input('min','number',5,'required min="0" step="1"')),f=>{const price=round(+f.get('price')),min=+f.get('min');if(!f.get('name').trim()||price<0||!Number.isFinite(price)||!Number.isInteger(min)||min<0)throw Error('Revisa los datos.');inventory.push({id:uuidNumber(),name:f.get('name').trim(),price,min});finish('Producto creado con existencia cero')})}
function stockForm(id){const p=inventory.find(p=>p.id===id);modal('Movimiento · '+p.name,field('Tipo','<select name="kind"><option>Entrada</option><option>Venta</option><option>Consumo interno</option><option>Ajuste positivo</option><option>Ajuste negativo</option></select>')+field('Unidades',input('qty','number',1,'required min="1" step="1"'))+field('Motivo',input('reason','text','','required maxlength="150"'))+'<p class="formhint">La venta se registra en efectivo en la caja abierta.</p>',f=>{const qty=+f.get('qty'),kind=f.get('kind'),negative=['Venta','Consumo interno','Ajuste negativo'].includes(kind);if(!Number.isInteger(qty)||qty<=0||!f.get('reason').trim())throw Error('Cantidad entera positiva y motivo obligatorios.');if(negative&&qty>stock(id))throw Error('Existencia insuficiente.');if(kind==='Venta'&&!cashOpen)throw Error('Abre la caja antes de vender.');stockLedger.push({id:uuidNumber(),date:today,product:id,delta:negative?-qty:qty,kind,reason:f.get('reason')});if(kind==='Venta')movements.push({id:uuidNumber(),date:today,amount:round(qty*p.price),type:'Efectivo',note:'Venta · '+p.name+' × '+qty,kind:'sale',session:currentCashId});logAction(kind+': '+p.name+' × '+qty);finish('Movimiento de inventario registrado')})}
function earned(a){const rate=a.commissionSnapshot?.rate??40;return a.status==='Completada'?round(a.paid*rate/100):0}
function paidCommission(id){return settlements.flatMap(s=>s.items).filter(i=>i.appointment===id).reduce((n,i)=>n+i.amount,0)}
function commissionPage(){const rows=appointments.filter(a=>a.status==='Completada');$('#main').innerHTML=heading('Comisiones del equipo','Calculadas sobre el pago neto de servicios completados.')+`<div class="cards">${barbers.map((b,i)=>{const earnedTotal=round(rows.filter(a=>a.barber===i).reduce((s,a)=>s+earned(a),0)),paid=round(settlements.filter(s=>s.barber===i).reduce((n,s)=>n+s.total,0));return `<article class="card"><h2>${esc(b)}</h2><strong class="price">${money(earnedTotal-paid)}</strong><p>Saldo por liquidar · regla actual ${commissionRules[i]?.rate||40}%<br>Devengado: ${money(earnedTotal)}<br>Liquidado: ${money(paid)}</p><div class="buttons"><button onclick="commissionForm(${i})">Cambiar regla</button><button onclick="settleForm(${i})">Liquidar</button></div></article>`}).join('')}</div><div class="notice">Los descuentos reducen la base porque se usa el importe cobrado. Las devoluciones reducen la comisión; si ya se liquidó, generan un ajuste pendiente sin cambiar la liquidación anterior. Regla inicial: 40%, sin propinas ni montos fijos.</div><h2 class="subhead">Liquidaciones registradas</h2><section class="panel"><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Barbero</th><th>Importe</th><th>Servicios incluidos</th></tr></thead><tbody>${settlements.map(s=>`<tr><td>${s.date}</td><td>${esc(barbers[s.barber])}</td><td>${money(s.total)}</td><td>${s.items.length}</td></tr>`).join('')||'<tr><td colspan="4">Sin liquidaciones registradas</td></tr>'}</tbody></table></div></section>`}
function commissionForm(i){modal('Regla de comisión · '+barbers[i],field('Porcentaje para futuras atenciones',input('rate','number',commissionRules[i]?.rate??40,'required min="0" max="100" step="0.01"'))+'<p class="formhint">Los servicios ya completados conservan su regla. Esta edición se aplicará al completar nuevas atenciones.</p>',f=>{const rate=+f.get('rate');if(!Number.isFinite(rate)||rate<0||rate>100)throw Error('Usa un porcentaje entre 0 y 100.');commissionRules[i]={rate};logAction('Comisión futura: '+barbers[i]+' '+rate+'%');finish('Regla guardada')})}
function settleForm(i){const items=appointments.filter(a=>a.barber===i&&a.status==='Completada').map(a=>({appointment:a.id,amount:round(earned(a)-paidCommission(a.id))})).filter(x=>x.amount!==0),total=round(items.reduce((n,x)=>n+x.amount,0));if(total<=0)return notify('No hay un saldo positivo por liquidar. Los ajustes negativos se compensarán con futuras comisiones.');modal('Registrar liquidación',`<p>${esc(barbers[i])}<br><b>${money(total)}</b> · ${items.length} servicios y ajustes</p><p class="formhint">Registra el cálculo de la liquidación. No transfiere dinero ni descuenta efectivo de caja. El pago debe registrarse por separado.</p>`,()=>{settlements.push({id:uuidNumber(),date:today,barber:i,items,total});logAction('Comisión liquidada: '+barbers[i]+' '+money(total));finish('Liquidación registrada')})}
function blockForm(){modal('Bloquear agenda',field('Profesional',`<select name="barber">${barbers.map((b,i)=>`<option value="${i}">${esc(b)}</option>`).join('')}</select>`)+field('Fecha',input('date','date',day,'required'))+`<div class="two">${field('Desde',input('start','time','09:00','required'))}${field('Hasta',input('end','time','10:00','required'))}</div>`+field('Motivo',input('reason','text','','required maxlength="150"')),f=>{const b={id:uuidNumber(),barber:+f.get('barber'),date:f.get('date'),start:minutes(f.get('start')),end:minutes(f.get('end')),reason:f.get('reason').trim()};if(b.date<today||b.start>=b.end||!b.reason)throw Error('Revisa fecha, horario y motivo.');if(appointments.some(a=>a.barber===b.barber&&a.date===b.date&&!['Cancelada','No asistió'].includes(a.status)&&minutes(a.time)<b.end&&minutes(a.time)+a.duration+(a.prep||0)>b.start))throw Error('El bloqueo se cruza con una cita. Reprográmala primero.');blocks.push(b);logAction('Agenda bloqueada: '+b.reason);finish('Bloqueo registrado')})}
function removeBlock(id){const b=blocks.find(x=>x.id===id);modal('Eliminar bloqueo',`<p>${esc(b.reason)} · ${b.date} ${clock(b.start)}–${clock(b.end)}</p>`,()=>{blocks=blocks.filter(x=>x.id!==id);logAction('Bloqueo eliminado');finish('Horario liberado')})}
function setupPage(){$('#main').innerHTML=heading('Configuración','Administra la operación y consulta el estado de las conexiones.')+`<div class="stats">${stat('Sistema','Barbe shop','Gestión de barberías')}${stat('Moneda','Boliviano','Importes en Bs')}${stat('Zona horaria','La Paz','America/La_Paz')}${stat('Sucursal','Local principal','Bolivia')}</div><div class="two"><section class="panel"><div class="panelhead"><h2>Operación del local</h2></div><div class="testlist"><div><b>Equipo y disponibilidad</b><p>Organiza profesionales, horarios, descansos y días libres.</p><button onclick="navigate('Equipo')">Gestionar equipo</button></div><div><b>Catálogo y precios</b><p>Configura servicios, duración y preparación entre citas.</p><button onclick="navigate('Servicios')">Gestionar servicios</button></div><div><b>Promociones y resultados</b><p>Define horarios, descuentos, cupos y condiciones. Revisa resultados por promoción.</p><button onclick="navigate('Promociones')">Gestionar promociones</button></div></div></section><section class="panel"><div class="panelhead"><h2>Conexiones y datos</h2></div><div class="settingslist"><div><span>Origen de los datos</span><b>Datos de ejemplo</b></div><div><span>Guardado</span><b>Solo durante esta sesión</b></div><div><span>Firebase y sincronización</span><b>Pendiente de conexión</b></div><div><span>Cuentas y permisos del servidor</span><b>Pendiente de conexión</b></div><div><span>WhatsApp</span><b>Enlaces con texto preparado</b></div><div><span>Verificación bancaria</span><b>No integrada</b></div><div><span>Facturación fiscal</span><b>No integrada</b></div></div><div style="padding:20px"><p class="formhint">Los cambios se pierden al recargar. El selector de perfil cambia la interfaz; todavía no inicia una sesión individual. Los datos e indicadores cargados no corresponden a la actividad real de una barbería.</p><div class="buttons"><button onclick="exportDemo()">Descargar registros</button><button onclick="resetLab()">Restablecer datos de ejemplo</button></div><p class="formhint">La descarga JSON permite revisar los registros de la sesión. Aún no hay restauración de copias.</p></div></section></div><h2 class="subhead">Bloqueos de agenda</h2><section class="panel"><div class="panelhead"><h2>Ausencias y tiempos no disponibles</h2><button onclick="blockForm()">＋ Bloquear horario</button></div><div class="tablewrap"><table><tbody>${blocks.map(b=>`<tr><td>${esc(barbers[b.barber])}</td><td>${b.date} ${clock(b.start)}–${clock(b.end)}</td><td>${esc(b.reason)}</td><td><button onclick="removeBlock(${b.id})">Quitar</button></td></tr>`).join('')||'<tr><td>No hay bloqueos adicionales.</td></tr>'}</tbody></table></div></section><h2 class="subhead">Actividad reciente</h2><section class="panel"><div class="tablewrap"><table><thead><tr><th>Hora</th><th>Cambio</th><th>Vista</th></tr></thead><tbody>${historyLog.slice(0,25).map(l=>`<tr><td>${new Date(l.time).toLocaleTimeString('es-BO',{timeZone:'America/La_Paz'})}</td><td>${esc(l.title)}</td><td>${l.role}</td></tr>`).join('')}</tbody></table></div></section>`}
function exportDemo(){download('barbe-shop-registros.json',JSON.stringify({demo:true,version:3,exportedAt:new Date().toISOString(),clients,appointments,movements,services,barbers,schedules,availabilityHistory,promos,inventory,stockLedger,commissionRules,settlements,cashSessions,historyLog},null,2),'application/json');notify('Registro descargado')}
function resetLab(){modal('Restablecer datos de ejemplo','<p>Se descartarán los cambios de esta sesión y volverá la muestra inicial. Descarga antes el registro si quieres conservarlo.</p>',()=>location.reload())}
function exportCSV(){if(role==='Barbero')return notify('Exportación no habilitada en esta vista.');const rows=[['Fecha_atencion','Hora','Cliente','Profesional','Servicio','Estado','Habitual_Bs','Descuento_Bs','Final_Bs','Pagado_neto_Bs','Promocion'],...periodRows().map(a=>[a.date,a.time,name(a),barbers[a.barber],a.serviceName,a.status,a.basePrice??a.price,round((a.basePrice??a.price)-a.price),a.price,a.paid,a.promoSnapshot?.name||''])];const cell=v=>{let s=String(v);if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('citas-barbe-shop.csv','\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');notify('CSV descargado')}
seedLab();
appointments.filter(a=>a.status==='Completada').forEach(a=>a.commissionSnapshot={rate:40,base:'cobrado neto de devoluciones'});
render();

function connectionInfo(){modal('Estado de conexión','<p>Firebase todavía no está conectado. Los cambios se pierden al recargar y no se comparten entre dispositivos.</p><p>Las cuentas individuales y los permisos del servidor están pendientes de implementación. Los datos cargados son de ejemplo.</p>',()=>closeModal())}

function agendaScope(){const start=calendarMode==='week'?shiftDate(day,-((dayOf(day)+6)%7)):day,end=calendarMode==='week'?shiftDate(start,6):day;return appointments.filter(a=>a.date>=start&&a.date<=end&&(role!=='Barbero'||a.barber===0)&&(filter==='Todos'||a.barber===+filter))}
function depositFields(old){if(role==='Barbero')return '';return `<fieldset class="depositbox"><legend>Anticipo de reserva</legend><p>Ya abonado: <b>${money(old?.paid||0)}</b>. Registra solo el dinero nuevo recibido.</p>${field('Anticipo recibido ahora (Bs)',input('deposit','number',0,'min="0" step="0.01"'))}${field('Medio de pago','<select name="depositMethod"><option>Efectivo</option><option>QR (registro manual)</option><option>Transferencia (registro manual)</option></select>')}<p class="formhint">Si no dejó anticipo, conserva 0. Para recibir dinero, abre primero la caja. QR y transferencia requieren revisión manual.</p></fieldset>`}
function validateDeposit(f,a){const raw=f.get('deposit'),amount=raw===null?0:Number(raw);if(!Number.isFinite(amount)||amount<0||Math.abs(amount*100-Math.round(amount*100))>0.00001)throw Error('Escribe un anticipo válido con hasta dos decimales.');if(amount===0)return 0;if(role==='Barbero')throw Error('Este perfil no registra cobros.');if(!cashOpen)throw Error('Abre la caja antes de registrar el anticipo. Puedes guardar la cita con anticipo 0.');if(amount>round(a.price-a.paid))throw Error('El anticipo no puede superar el saldo.');if(!['Efectivo','QR (registro manual)','Transferencia (registro manual)'].includes(f.get('depositMethod')))throw Error('Selecciona el medio de pago.');return amount}
function recordDeposit(a,amount,method){a.paid=round(a.paid+amount);movements.push({id:uuidNumber(),date:today,amount,type:method,note:'Anticipo de reserva · '+name(a),appointment:a.id,kind:'deposit',session:currentCashId});logAction('Anticipo '+money(amount)+' · '+method,a.id)}
function paymentSummary(a){if(role==='Barbero')return '';const deposits=movements.filter(m=>m.appointment===a.id&&m.kind==='deposit');return `<div class="payment-summary"><span>Total <b>${money(a.price)}</b></span><span>Anticipo <b>${money(deposits.reduce((n,m)=>n+m.amount,0))}</b></span>${deposits.length?`<small>${[...new Set(deposits.map(m=>m.type))].map(esc).join(' · ')}</small>`:''}<span>Abonado neto <b>${money(a.paid)}</b></span><span class="balance">Saldo <b>${money(round(a.price-a.paid))}</b></span></div>`}
function paymentHistory(a){if(role==='Barbero')return '';return movements.filter(m=>m.appointment===a.id).map(m=>`<p>${esc(m.date)} · ${m.amount<0?'Devolución':m.kind==='deposit'?'Anticipo':'Pago'} · ${esc(m.type)} · <b>${money(m.amount)}</b></p>`).join('')||'<p class="muted">Sin pagos registrados.</p>'}
function reminderDue(a,now=Date.now()){if(!['Pendiente','Confirmada'].includes(a.status))return false;const delta=new Date(a.date+'T'+a.time+':00-04:00').getTime()-now;return delta>=0&&delta<=3600000}
function reminderCard(a){const left=Math.max(0,Math.ceil((new Date(a.date+'T'+a.time+':00-04:00').getTime()-Date.now())/60000));return `<div class="reminder"><b>Recordatorio · en ${left} min</b><button type="button" onclick="whatsapp(${a.id})">Recordar por WhatsApp</button><small>El mensaje se envía desde WhatsApp.</small></div>`}
function reminderBanner(){const due=agendaScope().filter(a=>reminderDue(a));return due.length?`<div class="reminder-banner" role="status">${due.length} ${due.length===1?'cita empieza':'citas empiezan'} en la próxima hora. Revisa las tarjetas resaltadas para preparar el recordatorio.</div>`:''}
if(typeof setInterval==='function'){setInterval(()=>{if(view==='Agenda'&&!$('#modal').open){const focused=document.activeElement;if(focused?.closest?.('input,select,textarea'))return;agenda()}},30000);window.addEventListener('focus',()=>{if(view==='Agenda'&&!$('#modal').open)agenda()})}
</script></body></html>
