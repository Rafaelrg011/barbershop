function agenda(){const list=visible(),scoped=agendaScope();const pending=scoped.filter(a=>!['Cancelada','No asistió'].includes(a.status)&&a.paid<a.price);$('#main').innerHTML=heading('La agenda de tu barbería',new Date(day+'T12:00:00').toLocaleDateString('es-BO',{weekday:'long',day:'numeric',month:'long'}),'<div class="buttons"><button onclick="clientForm()">Nuevo cliente</button><button class="primary" onclick="bookingForm()">＋ Nueva cita</button></div>')+`<div class="stats">${stat(calendarMode==='week'?'Citas de la semana':'Citas del día',scoped.length,'Período y equipo seleccionados · todos los estados')}${stat('En atención',scoped.filter(a=>a.status==='En servicio').length,'En servicio en el período seleccionado')}${stat('Por confirmar',scoped.filter(a=>a.status==='Pendiente').length,'Citas pendientes de confirmación')}${stat(role==='Barbero'?'Atenciones completadas':'Pendiente de cobrar',role==='Barbero'?scoped.filter(a=>a.status==='Completada').length:money(pending.reduce((n,a)=>n+a.price-a.paid,0)),role==='Barbero'?'Servicios finalizados':pending.length+' citas con saldo, incluidas reservas')}</div>${reminderBanner()}<div class="toolbar"><div class="segmented"><button class="${calendarMode==='day'?'selected':''}" onclick="calendarMode='day';render()">Día</button><button class="${calendarMode==='week'?'selected':''}" onclick="calendarMode='week';render()">Semana</button></div><div class="filters"><button onclick="changeDay(calendarMode==='week'?-7:-1)" aria-label="Anterior">‹</button><button onclick="day=today;render()">Hoy</button><input aria-label="Fecha" type="date" value="${day}" onchange="day=this.value||today;render()"><button onclick="changeDay(calendarMode==='week'?7:1)" aria-label="Siguiente">›</button></div></div>${availabilityPanel()}<section class="panel"><div class="panelhead"><h2>${calendarMode==='day'?'Citas por profesional':'Tu semana de un vistazo'}</h2><div class="filters">${role!=='Barbero'?`<select aria-label="Barbero" onchange="filter=this.value;render()"><option value="Todos">Todo el equipo</option>${barbers.map((b,i)=>`<option value="${i}" ${filter===String(i)?'selected':''}>${esc(b)}</option>`).join('')}</select>`:''}<select aria-label="Estado de cita" onchange="statusFilter=this.value;render()">${['Todas','Pendiente','Confirmada','Cliente presente','En servicio','Completada','Cancelada','No asistió'].map(s=>`<option ${s===statusFilter?'selected':''}>${s}</option>`).join('')}</select></div></div>${calendarMode==='week'?weekBoard():`<div class="board" style="grid-template-columns:repeat(${role==='Barbero'||filter!=='Todos'?1:barbers.length},minmax(0,1fr))">${barbers.map((b,i)=>role==='Barbero'&&i!==0||filter!=='Todos'&&+filter!==i?'':`<div class="lane"><div class="barber"><span class="avatar">${esc(b.split(' ').map(n=>n[0]).join(''))}</span><div><b>${esc(b)}</b><small>${ranges(day,i).length? schedules[i].start+'–'+schedules[i].end:'Día libre'} · ${list.filter(a=>a.barber===i).length} citas</small></div></div>${list.filter(a=>a.barber===i).sort((a,b)=>a.time.localeCompare(b.time)).map(bookingCard).join('')||'<div class="empty">Agenda despejada<small>Las nuevas citas aparecerán aquí.</small></div>'}</div>`).join('')}</div>`}<div class="agendaBottom"><span>Las duraciones incluyen el tiempo de preparación configurado.</span><span>Hora de Bolivia · Bs</span></div></section>`}
function weekBoard(){const start=new Date(day+'T12:00:00');start.setDate(start.getDate()-((start.getDay()+6)%7));return '<div class="weekwrap"><div class="weekgrid">'+Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);const date=d.toISOString().slice(0,10);const items=appointments.filter(a=>a.date===date&&(role!=='Barbero'||a.barber===0)&&(filter==='Todos'||a.barber===+filter)&&(statusFilter==='Todas'||a.status===statusFilter));return `<div class="weekcol ${date===today?'current':''}"><button class="weekdate" onclick="day='${date}';calendarMode='day';render()">${d.toLocaleDateString('es-BO',{weekday:'short'})}<b>${d.getDate()}</b></button>${items.sort((a,b)=>a.time.localeCompare(b.time)).map(bookingCard).join('')||'<div class="empty">Sin citas</div>'}</div>`}).join('')+'</div></div>'}
function base_bookingCard(a){const next={'Pendiente':'Confirmar','Confirmada':'Llegó','Cliente presente':'Atender','En servicio':'Completar'};return `<article class="booking ${a.status==='En servicio'?'service':a.status==='Completada'?'done':['Cancelada','No asistió'].includes(a.status)?'cancelled':''}"><div class="time"><span>${a.time}–${clock(minutes(a.time)+a.duration+(a.prep||0))}</span><span class="badge">${a.status}</span></div><h3>${esc(name(a))}</h3><p>${esc(a.serviceName||services[a.service].name)} · ${a.duration} min${a.prep?' + '+a.prep+' preparación':''}${calendarMode==='week'?'<br>'+esc(barbers[a.barber]):''}</p><div class="bookingfoot"><b>${money(a.price)}</b><span>${role!=='Barbero'&&!['Cancelada','No asistió'].includes(a.status)?`<button onclick="paymentForm(${a.id})">Cobrar</button>`:''}${a.paid>=a.price?'<span class="badge">Pagado</span>':''} <button aria-label="Detalles de ${esc(name(a))}" onclick="detail(${a.id})">•••</button></span></div></article>`}
function base_advance(id){const a=appointments.find(a=>a.id===id),next={'Pendiente':'Confirmada','Confirmada':'Cliente presente','Cliente presente':'En servicio','En servicio':'Completada'};if(next[a.status]){a.status=next[a.status];logAction('Estado: '+a.status,id)}render();notify(a.status==='Completada'?'Atención completada. Falta registrar el cobro si corresponde.':'Estado actualizado')}
function base_detail(id){const a=appointments.find(a=>a.id===id),c=clients.find(c=>c.id===a.client);const open=!['Completada','Cancelada','No asistió'].includes(a.status);modal('Detalle e historial',`<h3>${esc(name(a))}</h3><p class="muted">${esc(a.serviceName)} · ${esc(barbers[a.barber])}<br>${a.date} · ${a.time} · ${a.status}</p><div class="summarystrip"><span>Total: <b>${money(a.price)}</b></span><span>Saldo: <b>${money(a.price-a.paid)}</b></span></div><div class="buttons" style="margin:18px 0">${open?`<button type="button" onclick="closeModal();bookingForm(${id})">Editar / reprogramar</button>`:''}${c?.phone?`<button type="button" onclick="whatsapp(${id})">Preparar WhatsApp</button>`:''}<button type="button" onclick="closeModal();clientDetail(${a.client})">Ver cliente</button></div>${open?field('Acción',`<select name="action"><option value="none">Conservar cita</option><option>Cancelada</option><option>No asistió</option></select>`)+field('Motivo de cancelación o ausencia',input('reason','text','','maxlength="180"')):''}<div class="history">${historyLog.filter(l=>l.entity===id).map(l=>`<p><strong>${esc(l.title)}</strong>${new Date(l.time).toLocaleString('es-BO',{timeZone:'America/La_Paz'})} · ${l.role}</p>`).join('')||'<p>Registro inicial.</p>'}</div>`,f=>{const state=f.get('action');if(state&&state!=='none'){if(!f.get('reason').trim())throw Error('Escribe el motivo del cambio.');a.status=state;logAction(state+': '+f.get('reason'),id)}finish('Detalle guardado')})}
function whatsapp(id){const a=appointments.find(x=>x.id===id);if(!a)return notify('La cita ya no está disponible.');const c=clients.find(x=>x.id===a.client);let phone=(c?.phone||'').replace(/\D/g,'');if(phone.length===8)phone='591'+phone;if(phone.length<10||phone.length>15)return notify('Agrega o revisa el teléfono del cliente, incluido el código de país.');const msg=reminderMessage(a);modal('Revisar recordatorio',`<div class="quote"><span>${esc(c.name)} · ${esc(barbers[a.barber])}</span><strong>${timeLabel(a.time)}</strong><small>${displayDate(a.date)} · hora de Bolivia</small></div><p class="formhint">Estos son los datos guardados de esta cita. Si la hora no es correcta, reprograma y guarda antes de preparar el mensaje.</p><p class="message-preview">${esc(msg)}</p><div class="buttons"><button type="button" onclick="closeModal();bookingForm(${id})">Corregir cita</button><a class="primary whatsapp-link" href="https://wa.me/${phone}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener noreferrer">Abrir WhatsApp</a></div><p class="formhint">Revisa el texto en WhatsApp antes de enviarlo. Abrir el enlace no registra el mensaje como enviado.</p>`,()=>closeModal())}
function timeLabel(time){if(!time)return 'Hora no registrada';const [h,m]=time.split(':').map(Number);return (h%12||12)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM')}
function displayDate(date){if(!date)return 'Fecha no registrada';return date.split('-').reverse().join('/')}
function reminderMessage(a){return `Hola, ${name(a)}. Te recordamos tu cita en The Barber el ${displayDate(a.date)} a la(s) ${timeLabel(a.time)} (hora de Bolivia), con ${barbers[a.barber]}. Servicio: ${a.serviceName}. Total: ${money(a.price)}. Abonado: ${money(a.paid)}. Saldo: ${money(round(a.price-a.paid))}. ¿Nos confirmas tu asistencia?`}

function clientRows(){$('#clientRows').innerHTML=clients.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())||c.phone.includes(search)).map(c=>`<tr><td><button style="border:0;padding:0;text-align:left" onclick="clientDetail(${c.id})">${esc(c.name)}</button></td><td>${esc(c.phone)||'Sin registrar'}</td><td>${appointments.filter(a=>a.client===c.id&&a.status==='Completada').length}</td><td>${appointments.filter(a=>a.client===c.id&&['Confirmada','Pendiente'].includes(a.status)).map(a=>a.date+' · '+a.time).join(', ')||'Sin cita pendiente'}</td></tr>`).join('')||'<tr><td colspan="4">No hay coincidencias.</td></tr>'}
function clientForm(id=null){const old=clients.find(c=>c.id===id);modal(old?'Editar cliente':'Nuevo cliente',field('Nombre',input('name','text',old?.name||'','required maxlength="80"'))+field('Teléfono (opcional)',input('phone','tel',old?.phone||'','maxlength="20"'))+field('Preferencias de corte',`<textarea name="notes" maxlength="300">${esc(old?.notes||'')}</textarea>`)+`<label class="inlinecheck"><input type="checkbox" name="consent" ${old?.consent?'checked':''}>Aceptó recibir promociones</label><p class="formhint">Registra el consentimiento solo si el cliente lo otorgó. Los recordatorios de citas son independientes.</p>`,f=>{const n=f.get('name').trim(),p=f.get('phone').trim();if(!n)throw Error('Escribe el nombre.');if(clients.some(c=>c.id!==id&&(c.name.toLowerCase()===n.toLowerCase()||p&&c.phone.replace(/\D/g,'')===p.replace(/\D/g,''))))throw Error('Hay un posible duplicado con ese nombre o teléfono.');const data={name:n,phone:p,notes:f.get('notes').trim(),consent:f.has('consent')};if(old)Object.assign(old,data);else clients.push({id:uuidNumber(),...data});logAction(old?'Cliente editado':'Cliente creado');finish('Cliente guardado')})}
function clientDetail(id){const c=clients.find(c=>c.id===id);modal('Ficha del cliente',`<h3>${esc(c.name)}</h3><p class="muted">${esc(c.phone)||'Sin teléfono'}<br>${c.consent?'Acepta promociones':'Sin consentimiento promocional'}</p><p>${esc(c.notes)||'Sin preferencias registradas.'}</p><button type="button" onclick="closeModal();clientForm(${id})">Editar datos</button><h3 class="subhead">Historial de visitas</h3><div class="history">${appointments.filter(a=>a.client===id).sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<p><strong>${a.date} · ${esc(a.serviceName)}</strong>${a.status} · ${esc(barbers[a.barber])} · ${money(a.price)}</p>`).join('')||'<p>Todavía no hay visitas.</p>'}</div>`,()=>closeModal())}
function servicePage(){$('#main').innerHTML=heading('Servicios y precios','Define cada servicio una vez; las citas guardan su precio original.',role==='Propietario'?'<button class="primary" onclick="serviceForm()">＋ Nuevo servicio</button>':'')+`<div class="cards">${services.map((s,i)=>`<article class="card"><span class="badge">${s.active?'Activo':'Desactivado'}</span><h2 style="margin-top:17px">${esc(s.name)}</h2><strong class="price">${money(s.price)}</strong><p>${s.duration} minutos de atención<br>${s.prep||0} minutos de preparación</p>${role==='Propietario'?`<button onclick="serviceForm(${i})">Editar servicio</button>`:''}</article>`).join('')}</div>`}
function serviceForm(id=null){if(role!=='Propietario')return;const s=services[id];modal(s?'Editar servicio':'Nuevo servicio',field('Nombre',input('name','text',s?.name||'','required maxlength="80"'))+`<div class="two">${field('Precio (Bs)',input('price','number',s?.price??40,'required min="0" max="100000" step="0.01"'))}${field('Duración (min)',input('duration','number',s?.duration??30,'required min="5" max="480" step="5"'))}</div>`+field('Preparación después del servicio (min)',input('prep','number',s?.prep??0,'required min="0" max="60" step="5"'))+`<label class="inlinecheck"><input type="checkbox" name="active" ${!s||s.active?'checked':''}>Disponible para nuevas citas</label><p class="formhint">Las citas existentes conservan precio, nombre y duración. Este cambio se aplica a nuevas reservas.</p>`,f=>{const data={name:f.get('name').trim(),price:Math.round(+f.get('price')*100)/100,duration:+f.get('duration'),prep:+f.get('prep'),active:f.has('active')};if(!data.name||!Number.isFinite(data.price)||data.price<0||data.duration<5||data.duration>480||data.prep<0||data.prep>60)throw Error('Revisa los valores del servicio.');if(s)Object.assign(s,data);else services.push(data);logAction('Catálogo actualizado: '+data.name);finish('Servicio guardado')})}
function teamPage(){$('#main').innerHTML=heading('Equipo y horarios','Organiza la jornada de cada profesional.','<button class="primary" onclick="staffForm()">＋ Agregar barbero</button>')+`<div class="cards">${barbers.map((b,i)=>`<article class="card"><span class="avatar">${esc(b.split(' ').map(x=>x[0]).join(''))}</span><h2 style="margin-top:18px">${esc(b)}</h2><p>${schedules[i].active?'Activo':'Inactivo'} · ${schedules[i].start}–${schedules[i].end}<br>Descanso: ${schedules[i].breakStart}–${schedules[i].breakEnd}<br>${schedules[i].days.map(d=>['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d]).join(' · ')}</p><button onclick="staffForm(${i})">Editar horario</button></article>`).join('')}</div><div class="notice">Las cuentas individuales y los permisos del servidor están pendientes de conexión. Consulta su estado en Configuración.</div>`}
function base_staffForm(id=null){if(role!=='Propietario')return;const s=schedules[id]||{start:'09:00',end:'18:00',breakStart:'13:00',breakEnd:'14:00',days:[1,2,3,4,5,6],active:true};modal(id===null?'Nuevo barbero':'Editar profesional',field('Nombre',input('name','text',barbers[id]||'','required maxlength="80"'))+`<div class="two">${field('Entrada',input('start','time',s.start,'required'))}${field('Salida',input('end','time',s.end,'required'))}${field('Descanso desde',input('bs','time',s.breakStart,'required'))}${field('Descanso hasta',input('be','time',s.breakEnd,'required'))}</div><div class="daychecks">${[1,2,3,4,5,6,0].map(d=>`<label><input type="checkbox" name="d${d}" ${s.days.includes(d)?'checked':''}>${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d]}</label>`).join('')}</div><label class="inlinecheck"><input type="checkbox" name="active" ${s.active?'checked':''}>Activo para nuevas citas</label><p class="formhint">No se permite dejar citas futuras fuera del horario. Reprográmalas primero.</p>`,f=>{const n=f.get('name').trim(),next={start:f.get('start'),end:f.get('end'),breakStart:f.get('bs'),breakEnd:f.get('be'),days:[0,1,2,3,4,5,6].filter(d=>f.has('d'+d)),active:f.has('active')};if(!n||next.start>=next.end||next.breakStart<next.start||next.breakEnd>next.end||next.breakStart>=next.breakEnd)throw Error('Revisa los horarios de jornada y descanso.');if(id!==null){const previous=schedules[id];schedules[id]=next;try{appointments.filter(a=>a.barber===id&&a.date>=today&&!['Completada','Cancelada','No asistió'].includes(a.status)).forEach(a=>validateBooking(a,a.id))}catch{ schedules[id]=previous;throw Error('Hay citas pendientes que quedarían fuera del horario. Reprográmalas antes.')}barbers[id]=n}else{barbers.push(n);schedules.push(next)}logAction('Horario actualizado: '+n);finish('Profesional guardado')})}
function reportDays(){if(!reportFrom||!reportTo||reportFrom>reportTo)return [];const out=[];let d=new Date(reportFrom+'T12:00:00');for(let n=0;d.toISOString().slice(0,10)<=reportTo&&n<366;n++){out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}return out}
function download(filename,content,mime){const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function base_paymentForm(id){const a=appointments.find(a=>a.id===id);if(!cashOpen){notify('Abre la caja antes de registrar el cobro.');navigate('Caja');return}modal('Cobrar atención',`<h3>${esc(name(a))}</h3><p>Saldo: <b>${money(a.price-a.paid)}</b></p>`+field('Importe recibido (Bs)',input('amount','number',(a.price-a.paid).toFixed(2),'required min="0.01" step="0.01"'))+field('Método','<select name="method"><option>Efectivo</option><option>QR (registro manual)</option><option>Transferencia (registro manual)</option></select>')+'<p class="formhint">Puedes registrar un pago parcial. QR y transferencias requieren revisión manual.</p>',f=>{const amount=Math.round(+f.get('amount')*100)/100;if(!cashOpen||!Number.isFinite(amount)||amount<=0||amount>Math.round((a.price-a.paid)*100)/100)throw Error('El importe debe ser positivo y no superar el saldo.');a.paid=Math.round((a.paid+amount)*100)/100;movements.push({id:uuidNumber(),at:new Date().toISOString(),actor:role,date:localCashDate(),amount,type:f.get('method'),note:'Cobro · '+name(a),appointment:id,kind:a.status==='Completada'?'payment':'deposit',session:currentCashId});logAction('Pago de '+money(amount)+' · '+f.get('method'),id);finish('Pago registrado')})}
function legacy_cashAction(){if(!cashOpen){modal('Abrir una nueva caja',field('Fondo inicial en efectivo (Bs)',input('amount','number','0','required min="0" step="0.01"'))+'<p class="formhint">El fondo inicial no es un ingreso por ventas.</p>',f=>{opening=Math.round(+f.get('amount')*100)/100;if(!Number.isFinite(opening)||opening<0)throw Error('Revisa el importe.');currentCashId=uuidNumber();cashSessions.push({id:currentCashId,opening,date:today});cashOpen=true;closed=false;logAction('Apertura de caja: '+money(opening));finish('Caja abierta')})}else{const expected=cashExpected();modal('Cerrar caja',`<p>Efectivo esperado: <b>${money(expected)}</b></p>`+field('Efectivo contado (Bs)',input('amount','number',expected,'required min="0" step="0.01"'))+field('Motivo de diferencia',input('reason','text','','maxlength="180"')),f=>{const counted=Math.round(+f.get('amount')*100)/100;if(!Number.isFinite(counted)||counted<0)throw Error('Revisa el efectivo contado.');const diff=Math.round((counted-expected)*100)/100;if(diff&&!f.get('reason').trim())throw Error('Explica la diferencia de caja.');Object.assign(cashSessions.find(s=>s.id===currentCashId),{expected,counted,diff,reason:f.get('reason'),closed:true});cashOpen=false;closed=true;logAction('Caja cerrada · diferencia '+money(diff));finish('Cierre registrado: '+money(diff)+' de diferencia')})}}
function cashExpected(){return opening+movements.filter(m=>m.session===currentCashId&&m.type==='Efectivo').reduce((s,m)=>s+m.amount,0)}
function expenseForm(){if(!cashOpen)return notify('Abre la caja primero.');modal('Registrar gasto en efectivo',field('Concepto',input('note','text','','required maxlength="100"'))+field('Importe (Bs)',input('amount','number','','required min="0.01" step="0.01"')),f=>{const amount=Math.round(+f.get('amount')*100)/100;if(!Number.isFinite(amount)||amount<=0||!f.get('note').trim())throw Error('Revisa el importe y el concepto.');if(amount>cashExpected())throw Error('El gasto supera el efectivo disponible en esta caja.');movements.push({id:uuidNumber(),at:new Date().toISOString(),actor:role,date:localCashDate(),amount:-amount,type:'Efectivo',note:f.get('note').trim(),session:currentCashId});logAction('Gasto: '+money(amount));finish('Gasto registrado')})}
function base_cashPage(){const income=movements.filter(m=>m.amount>0).reduce((s,m)=>s+m.amount,0),pending=appointments.filter(a=>a.status==='Completada'&&a.paid<a.price);$('#main').innerHTML=heading('Caja y cobros','Cada movimiento queda separado de las citas y del fondo inicial.',`<button class="primary" onclick="cashAction()">${cashOpen?'Cerrar caja':'Abrir caja'}</button>`)+`<div class="stats">${stat('Caja actual',cashOpen?'Abierta':'Cerrada',cashOpen?'Lista para registrar movimientos':'Abre una caja para cobrar')}${stat('Cobrado en la muestra',money(income),'Todos los medios de pago')}${stat('Efectivo de caja actual',cashOpen?money(cashExpected()):'—','Fondo + cobros − gastos')}${stat('Pendiente de cobrar',money(pending.reduce((s,a)=>s+a.price-a.paid,0)),'Atenciones finalizadas')}</div><div class="two"><section class="panel"><div class="panelhead"><h2>Atenciones por cobrar</h2></div>${pending.map(a=>`<div class="panelhead"><div><b>${esc(name(a))}</b><p class="muted">${money(a.price-a.paid)} · ${esc(a.serviceName)}</p></div><button onclick="paymentForm(${a.id})">Cobrar</button></div>`).join('')||'<div class="empty">No hay saldos pendientes</div>'}</section><section class="panel"><div class="panelhead"><h2>Movimientos</h2><button onclick="expenseForm()">＋ Gasto</button></div><div class="tablewrap"><table><tbody>${movements.slice().reverse().map(m=>`<tr><td>${esc(m.note)}<small>${esc(m.type)}${!m.session?' · muestra inicial':''}</small></td><td>${money(m.amount)}</td></tr>`).join('')}</tbody></table></div></section></div><h2 class="subhead">Cierres de caja</h2><section class="panel"><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Esperado</th><th>Contado</th><th>Diferencia</th><th>Motivo</th></tr></thead><tbody>${cashSessions.filter(s=>s.closed).map(s=>`<tr><td>${s.date}</td><td>${money(s.expected)}</td><td>${money(s.counted)}</td><td>${money(s.diff)}</td><td>${esc(s.reason)||'Sin diferencia'}</td></tr>`).join('')||'<tr><td colspan="5">Aún no hay cierres en esta sesión.</td></tr>'}</tbody></table></div></section><p class="metrichelp">Los ingresos no son ganancias. El movimiento inicial de Bs 40 pertenece a la muestra, no al efectivo de una caja recién abierta. No se emiten facturas fiscales.</p>`}

function stockForm(id){const p=inventory.find(p=>p.id===id);modal('Movimiento · '+p.name,field('Tipo','<select name="kind"><option>Entrada</option><option>Venta</option><option>Consumo interno</option><option>Ajuste positivo</option><option>Ajuste negativo</option></select>')+field('Unidades',input('qty','number',1,'required min="1" step="1"'))+field('Motivo',input('reason','text','','required maxlength="150"'))+'<p class="formhint">La venta se registra en efectivo en la caja abierta.</p>',f=>{const qty=+f.get('qty'),kind=f.get('kind');if(kind==='Venta'){closeModal();sellProduct(id);return}const negative=['Venta','Consumo interno','Ajuste negativo'].includes(kind);if(!Number.isInteger(qty)||qty<=0||!f.get('reason').trim())throw Error('Cantidad entera positiva y motivo obligatorios.');if(negative&&qty>stock(id))throw Error('Existencia insuficiente.');if(kind==='Venta'&&!cashOpen)throw Error('Abre la caja antes de vender.');stockLedger.push({id:uuidNumber(),date:today,product:id,delta:negative?-qty:qty,kind,reason:f.get('reason')});if(kind==='Venta')movements.push({id:uuidNumber(),at:new Date().toISOString(),actor:role,date:localCashDate(),amount:round(qty*p.price),type:'Efectivo',note:'Venta · '+p.name+' × '+qty,kind:'sale',session:currentCashId});logAction(kind+': '+p.name+' × '+qty);finish('Movimiento de inventario registrado')})}
function earned(a){const rate=a.commissionSnapshot?.rate??40;return a.status==='Completada'?round(a.paid*rate/100):0}

function legacy_commissionPage(){const rows=appointments.filter(a=>a.status==='Completada');$('#main').innerHTML=heading('Comisiones del equipo','Calculadas sobre el pago neto de servicios completados.')+`<div class="cards">${barbers.map((b,i)=>{const earnedTotal=round(rows.filter(a=>a.barber===i).reduce((s,a)=>s+earned(a),0)),paid=round(settlements.filter(s=>s.barber===i).reduce((n,s)=>n+s.total,0));return `<article class="card"><h2>${esc(b)}</h2><strong class="price">${money(earnedTotal-paid)}</strong><p>Saldo por liquidar · regla actual ${commissionRules[i]?.rate||40}%<br>Devengado: ${money(earnedTotal)}<br>Liquidado: ${money(paid)}</p><div class="buttons"><button onclick="commissionForm(${i})">Cambiar regla</button><button onclick="settleForm(${i})">Liquidar</button></div></article>`}).join('')}</div><div class="notice">Los descuentos reducen la base porque se usa el importe cobrado. Las devoluciones reducen la comisión; si ya se liquidó, generan un ajuste pendiente sin cambiar la liquidación anterior. Regla inicial: 40%, sin propinas ni montos fijos.</div><h2 class="subhead">Liquidaciones registradas</h2><section class="panel"><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Barbero</th><th>Importe</th><th>Servicios incluidos</th></tr></thead><tbody>${settlements.map(s=>`<tr><td>${s.date}</td><td>${esc(barbers[s.barber])}</td><td>${money(s.total)}</td><td>${s.items.length}</td></tr>`).join('')||'<tr><td colspan="4">Sin liquidaciones registradas</td></tr>'}</tbody></table></div></section>`}
function commissionForm(i){modal('Regla de comisión · '+barbers[i],field('Porcentaje para futuras atenciones',input('rate','number',commissionRules[i]?.rate??40,'required min="0" max="100" step="0.01"'))+'<p class="formhint">Los servicios ya completados conservan su regla. Esta edición se aplicará al completar nuevas atenciones.</p>',f=>{const rate=+f.get('rate');if(!Number.isFinite(rate)||rate<0||rate>100)throw Error('Usa un porcentaje entre 0 y 100.');commissionRules[i]={rate};logAction('Comisión futura: '+barbers[i]+' '+rate+'%');finish('Regla guardada')})}
function legacy_settleForm(i){const items=appointments.filter(a=>a.barber===i&&a.status==='Completada').map(a=>({appointment:a.id,amount:round(earned(a)-paidCommission(a.id))})).filter(x=>x.amount!==0),total=round(items.reduce((n,x)=>n+x.amount,0));if(total<=0)return notify('No hay un saldo positivo por liquidar. Los ajustes negativos se compensarán con futuras comisiones.');modal('Registrar liquidación',`<p>${esc(barbers[i])}<br><b>${money(total)}</b> · ${items.length} servicios y ajustes</p><p class="formhint">Registra el cálculo de la liquidación. No transfiere dinero ni descuenta efectivo de caja. El pago debe registrarse por separado.</p>`,()=>{settlements.push({id:uuidNumber(),date:today,barber:i,items,total});logAction('Comisión liquidada: '+barbers[i]+' '+money(total));finish('Liquidación registrada')})}
function blockForm(){modal('Bloquear agenda',field('Profesional',`<select name="barber">${barbers.map((b,i)=>`<option value="${i}">${esc(b)}</option>`).join('')}</select>`)+field('Fecha',input('date','date',day,'required'))+`<div class="two">${field('Desde',input('start','time','09:00','required'))}${field('Hasta',input('end','time','10:00','required'))}</div>`+field('Motivo',input('reason','text','','required maxlength="150"')),f=>{const b={id:uuidNumber(),barber:+f.get('barber'),date:f.get('date'),start:minutes(f.get('start')),end:minutes(f.get('end')),reason:f.get('reason').trim()};if(b.date<today||b.start>=b.end||!b.reason)throw Error('Revisa fecha, horario y motivo.');if(appointments.some(a=>a.barber===b.barber&&a.date===b.date&&!['Cancelada','No asistió'].includes(a.status)&&minutes(a.time)<b.end&&minutes(a.time)+a.duration+(a.prep||0)>b.start))throw Error('El bloqueo se cruza con una cita. Reprográmala primero.');blocks.push(b);logAction('Agenda bloqueada: '+b.reason);finish('Bloqueo registrado')})}
function removeBlock(id){const b=blocks.find(x=>x.id===id);modal('Eliminar bloqueo',`<p>${esc(b.reason)} · ${b.date} ${clock(b.start)}–${clock(b.end)}</p>`,()=>{blocks=blocks.filter(x=>x.id!==id);logAction('Bloqueo eliminado');finish('Horario liberado')})}
function setupPage(){$('#main').innerHTML=heading('Configuración','Administra la operación y consulta el estado de las conexiones.')+`<div class="stats">${stat('Sistema','The Barber','Gestión de barberías')}${stat('Moneda','Boliviano','Importes en Bs')}${stat('Zona horaria','La Paz','America/La_Paz')}${stat('Sucursal','Local principal','Bolivia')}</div><div class="two"><section class="panel"><div class="panelhead"><h2>Operación del local</h2></div><div class="testlist"><div><b>Equipo y disponibilidad</b><p>Organiza profesionales, horarios, descansos y días libres.</p><button onclick="navigate('Equipo')">Gestionar equipo</button></div><div><b>Catálogo y precios</b><p>Configura servicios, duración y preparación entre citas.</p><button onclick="navigate('Servicios')">Gestionar servicios</button></div><div><b>Promociones y resultados</b><p>Define horarios, descuentos, cupos y condiciones. Revisa resultados por promoción.</p><button onclick="navigate('Promociones')">Gestionar promociones</button></div></div></section><section class="panel"><div class="panelhead"><h2>Conexiones y datos</h2></div><div class="settingslist"><div><span>Origen de los datos</span><b>Datos de ejemplo</b></div><div><span>Guardado</span><b>Solo durante esta sesión</b></div><div><span>Firebase y sincronización</span><b>Pendiente de conexión</b></div><div><span>Cuentas y permisos del servidor</span><b>Pendiente de conexión</b></div><div><span>WhatsApp</span><b>Enlaces con texto preparado</b></div><div><span>Verificación bancaria</span><b>No integrada</b></div><div><span>Facturación fiscal</span><b>No integrada</b></div></div><div style="padding:20px"><p class="formhint">Los cambios se pierden al recargar. El selector de perfil cambia la interfaz; todavía no inicia una sesión individual. Los datos e indicadores cargados no corresponden a la actividad real de una barbería.</p><div class="buttons"><button onclick="exportDemo()">Descargar registros</button><button onclick="resetLab()">Restablecer datos de ejemplo</button></div><p class="formhint">El informe reúne los registros de la sesión en tablas legibles. Puedes imprimirlo o guardarlo como PDF desde el navegador; no es una copia restaurable.</p></div></section></div><h2 class="subhead">Bloqueos de agenda</h2><section class="panel"><div class="panelhead"><h2>Ausencias y tiempos no disponibles</h2><button onclick="blockForm()">＋ Bloquear horario</button></div><div class="tablewrap"><table><tbody>${blocks.map(b=>`<tr><td>${esc(barbers[b.barber])}</td><td>${b.date} ${clock(b.start)}–${clock(b.end)}</td><td>${esc(b.reason)}</td><td><button onclick="removeBlock(${b.id})">Quitar</button></td></tr>`).join('')||'<tr><td>No hay bloqueos adicionales.</td></tr>'}</tbody></table></div></section><h2 class="subhead">Actividad reciente</h2><section class="panel"><div class="tablewrap"><table><thead><tr><th>Hora</th><th>Cambio</th><th>Vista</th></tr></thead><tbody>${historyLog.slice(0,25).map(l=>`<tr><td>${new Date(l.time).toLocaleTimeString('es-BO',{timeZone:'America/La_Paz'})}</td><td>${esc(l.title)}</td><td>${l.role}</td></tr>`).join('')}</tbody></table></div></section>`}

function agendaScope(){const start=calendarMode==='week'?shiftDate(day,-((dayOf(day)+6)%7)):day,end=calendarMode==='week'?shiftDate(start,6):day;return appointments.filter(a=>a.date>=start&&a.date<=end&&(role!=='Barbero'||a.barber===0)&&(filter==='Todos'||a.barber===+filter))}
function depositFields(old){if(role==='Barbero')return '';return `<fieldset class="depositbox"><legend>Anticipo de reserva</legend><p>Ya abonado: <b>${money(old?.paid||0)}</b>. Registra solo el dinero nuevo recibido.</p>${field('Anticipo recibido ahora (Bs)',input('deposit','number',0,'min="0" step="0.01"'))}${field('Medio de pago','<select name="depositMethod"><option>Efectivo</option><option>QR (registro manual)</option><option>Transferencia (registro manual)</option></select>')}<p class="formhint">Si no dejó anticipo, conserva 0. Para recibir dinero, abre primero la caja. QR y transferencia requieren revisión manual.</p></fieldset>`}
function validateDeposit(f,a){const raw=f.get('deposit'),amount=raw===null?0:Number(raw);if(!Number.isFinite(amount)||amount<0||Math.abs(amount*100-Math.round(amount*100))>0.00001)throw Error('Escribe un anticipo válido con hasta dos decimales.');if(amount===0)return 0;if(role==='Barbero')throw Error('Este perfil no registra cobros.');if(!cashOpen)throw Error('Abre la caja antes de registrar el anticipo. Puedes guardar la cita con anticipo 0.');if(amount>round(a.price-a.paid))throw Error('El anticipo no puede superar el saldo.');if(!['Efectivo','QR (registro manual)','Transferencia (registro manual)'].includes(f.get('depositMethod')))throw Error('Selecciona el medio de pago.');return amount}
function recordDeposit(a,amount,method){a.paid=round(a.paid+amount);movements.push({id:uuidNumber(),at:new Date().toISOString(),actor:role,date:localCashDate(),amount,type:method,note:'Anticipo de reserva · '+name(a),appointment:a.id,kind:'deposit',session:currentCashId});logAction('Anticipo '+money(amount)+' · '+method,a.id)}
function paymentSummary(a){if(role==='Barbero')return '';const deposits=movements.filter(m=>m.appointment===a.id&&m.kind==='deposit');return `<div class="payment-summary"><span>Total <b>${money(a.price)}</b></span><span>Anticipo <b>${money(deposits.reduce((n,m)=>n+m.amount,0))}</b></span>${deposits.length?`<small>${[...new Set(deposits.map(m=>m.type))].map(esc).join(' · ')}</small>`:''}<span>Abonado neto <b>${money(a.paid)}</b></span><span class="balance">Saldo <b>${money(round(a.price-a.paid))}</b></span></div>`}
function paymentHistory(a){if(role==='Barbero')return '';return movements.filter(m=>m.appointment===a.id).map(m=>`<p>${esc(m.date)} · ${m.amount<0?'Devolución':m.kind==='deposit'?'Anticipo':'Pago'} · ${esc(m.type)} · <b>${money(m.amount)}</b></p>`).join('')||'<p class="muted">Sin pagos registrados.</p>'}
function reminderDue(a,now=Date.now()){if(!['Pendiente','Confirmada'].includes(a.status))return false;const delta=new Date(a.date+'T'+a.time+':00-04:00').getTime()-now;return delta>=0&&delta<=3600000}
function reminderCard(a){const left=Math.max(0,Math.ceil((new Date(a.date+'T'+a.time+':00-04:00').getTime()-Date.now())/60000));return `<div class="reminder"><b>Recordatorio · en ${left} min</b><button type="button" onclick="whatsapp(${a.id})">Recordar por WhatsApp</button><small>El mensaje se envía desde WhatsApp.</small></div>`}
function reminderBanner(){const due=agendaScope().filter(a=>reminderDue(a));return due.length?`<div class="reminder-banner" role="status">${due.length} ${due.length===1?'cita empieza':'citas empiezan'} en la próxima hora. Revisa las tarjetas resaltadas para preparar el recordatorio.</div>`:''}
if(typeof setInterval==='function'){setInterval(()=>{if(view==='Agenda'&&!$('#modal').open){const focused=document.activeElement;if(focused?.closest?.('input,select,textarea'))return;agenda()}},30000);window.addEventListener('focus',()=>{if(view==='Agenda'&&!$('#modal').open)agenda()})}

function freeRanges(date,barber,now=Date.now()){if(!schedules[barber]?.active)return [];let free=ranges(date,barber);for(const a of appointments.filter(a=>a.date===date&&a.barber===barber&&!['Cancelada','No asistió'].includes(a.status))){const start=minutes(a.time),end=start+a.duration+(a.prep||0);free=free.flatMap(([x,y])=>[[x,Math.min(y,start)],[Math.max(x,end),y]].filter(([l,r])=>r>l))}const midnight=Date.parse(date+'T00:00:00-04:00'),cutoff=Math.max(0,Math.ceil((now-midnight)/60000/5)*5);return free.map(([x,y])=>[Math.max(x,cutoff),y]).filter(([x,y])=>y>x)}
function availableStarts(date,barber,service,now=Date.now()){const s=services[service];if(!s?.active)return [];const duration=s.duration+(s.prep||0);return freeRanges(date,barber,now).flatMap(([x,y])=>{const starts=[];for(let n=Math.ceil(x/5)*5;n+duration<=y;n+=5)starts.push(n);return starts})}
function availabilityPanel(){if(!services[availabilityService]?.active)availabilityService=services.findIndex(s=>s.active);const service=services[availabilityService],start=calendarMode==='week'?shiftDate(day,-((dayOf(day)+6)%7)):day;const dates=Array.from({length:calendarMode==='week'?7:1},(_,i)=>shiftDate(start,i));const staff=activeStaff().filter(b=>(role!=='Barbero'||b.id===0)&&(filter==='Todos'||b.id===+filter));return `<section class="panel availability-panel"><div class="panelhead"><div><h2>Espacios disponibles</h2><p class="muted">Elige servicio y profesional; abre una franja para reservar.</p></div><label>Servicio<select aria-label="Servicio para disponibilidad" onchange="availabilityService=+this.value;render()">${services.map((s,i)=>s.active?`<option value="${i}" ${i===availabilityService?'selected':''}>${esc(s.name)} · ${s.duration+(s.prep||0)} min</option>`:'').join('')}</select></label></div><div class="availability-grid ${calendarMode==='week'?'availability-week':''}">${dates.map(date=>`<div class="availability-day"><h3>${new Date(date+'T12:00:00-04:00').toLocaleDateString('es-BO',{weekday:'short',day:'numeric',month:'short',timeZone:'America/La_Paz'})}</h3>${staff.map(b=>{const free=freeRanges(date,b.id).filter(([x,y])=>service&&y-x>=service.duration+(service.prep||0));return `<div class="availability-staff"><b>${esc(b.name)}</b>${free.length?free.map(([x,y])=>`<details><summary>${timeLabel(clock(x))}–${timeLabel(clock(y))}</summary><div class="slot-buttons">${availableStarts(date,b.id,availabilityService).filter(n=>n>=x&&n<y).map(n=>`<button onclick="bookFreeSlot('${date}',${b.id},${availabilityService},'${clock(n)}')">${timeLabel(clock(n))}</button>`).join('')}</div></details>`).join(''):'<small>Sin espacio para este servicio</small>'}</div>`}).join('')||'<p>No hay profesionales activos.</p>'}</div>`).join('')}</div><p class="metrichelp" style="padding:0 20px 16px">Horarios de Bolivia. Se descuentan citas, preparación, descansos y bloqueos. Solo se muestran espacios futuros donde cabe el servicio completo. El filtro de estado no libera horarios ocupados.</p></section>`}
function bookFreeSlot(date,barber,service,time){if(!availableStarts(date,barber,service).includes(minutes(time))){render();return notify('Este horario ya no está disponible. Elige otro.')}bookingForm(null,date,{barber,service,time})}

function localCashDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/La_Paz',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function stamp(at){return at?new Date(at).toLocaleString('es-BO',{timeZone:'America/La_Paz',hour12:true}):'Hora no registrada'}
function countCash(f){const counts=['bills','coins'].map((key,i)=>{const amount=Number(f.get(key)||0);if(!Number.isFinite(amount)||amount<0||amount>100000000||Math.abs(amount*100-Math.round(amount*100))>0.00001)throw Error('Ingresa importes no negativos con hasta dos decimales.');return {label:i?'Monedas':'Billetes',amount:round(amount)}});return {counts,total:round(counts.reduce((n,x)=>n+Math.round(x.amount*100),0)/100)}}
function countFields(){return `<h3>Efectivo disponible</h3><div class="two">${field('Importe en billetes (Bs)',input('bills','number',0,'required min="0" max="100000000" step="0.01" inputmode="decimal"'))}${field('Importe en monedas (Bs)',input('coins','number',0,'required min="0" max="100000000" step="0.01" inputmode="decimal"'))}</div><p class="formhint">Escribe cuánto dinero hay en billetes y cuánto en monedas. El total se calcula automáticamente.</p><div class="quote" id="cashCountPreview" aria-live="polite"></div>`}

function methodNet(id,type){return round(sessionMoves(id).filter(m=>m.type===type).reduce((n,m)=>n+m.amount,0))}
function differenceLabel(diff){return diff===0?'Cuadra':diff<0?'Faltante de '+money(-diff):'Sobrante de '+money(diff)}
function cashAction(){if(role==='Barbero')return notify('Perfil sin acceso a caja.');const closing=cashOpen,id=currentCashId;modal(closing?'Arqueo y cierre de caja':'Apertura de caja',countFields()+(closing?'<div id="digitalCloseSummary"></div>':'')+field('Observaciones / motivo de diferencia',input('reason','text','','maxlength="300"'))+'<p class="formhint">El QR se suma desde los cobros registrados, sin volver a ingresarlo al cerrar. No verifica el banco. El fondo inicial no es una venta.</p>',f=>{if(closing!==cashOpen||(closing&&id!==currentCashId))throw Error('La caja cambió. Vuelve a abrir el formulario.');const count=countCash(f),at=new Date().toISOString(),reason=String(f.get('reason')||'').trim();if(!closing){opening=count.total;currentCashId=uuidNumber();cashSessions.push({id:currentCashId,date:localCashDate(),opening,openingCounts:count.counts,openedAt:at,openedBy:role,openingNote:reason,closed:false});cashOpen=true;closed=false;cashViewId='current';logAction('Apertura de caja '+money(opening));finish('Caja abierta')}else{const expected=round(cashExpected()),diff=round(count.total-expected);const digital=['QR (registro manual)','Transferencia (registro manual)'].map(type=>({type,expected:methodNet(id,type),reviewed:null,diff:null,source:'movimientos'}));if(diff&&!reason)throw Error('Explica la diferencia del efectivo contado.');Object.assign(cashSessions.find(x=>x.id===id),{expected,counted:count.total,closingCounts:count.counts,diff,reason,closed:true,closedAt:at,closedBy:role,digital,qrNet:methodNet(id,'QR (registro manual)'),closingTotal:round(count.total+digital.reduce((n,d)=>n+d.expected,0)),movementSnapshot:structuredClone(sessionMoves(id))});cashOpen=false;closed=true;cashViewId=String(id);logAction('Cierre de caja · '+differenceLabel(diff));finish(differenceLabel(diff))}});const update=()=>{try{const c=countCash(new FormData($('#form')));if(closing)$('#digitalCloseSummary').innerHTML=qrCloseSummary(id,c.total);$('#cashCountPreview').innerHTML=`<span>Efectivo contado</span><strong>${money(c.total)}</strong>${closing?`<small>Esperado: ${money(cashExpected())} · ${differenceLabel(round(c.total-cashExpected()))}</small>`:'<small>Este será el fondo inicial de la caja.</small>'}`}catch(e){$('#cashCountPreview').textContent=e.message}};$('#fields').oninput=update;update()}
function cashLedger(rows){return `<div class="tablewrap"><table><thead><tr><th>Fecha y hora</th><th>Concepto / referencia</th><th>Medio</th><th>Entrada</th><th>Salida</th><th>Perfil</th></tr></thead><tbody>${rows.map(m=>`<tr><td>${m.at?stamp(m.at):esc(m.date)+' · hora no registrada'}</td><td>${esc(m.note)}<small>Movimiento ${m.id}${m.appointment?' · Cita '+m.appointment:''}</small></td><td>${esc(m.type)}</td><td>${m.amount>0?money(m.amount):'—'}</td><td>${m.amount<0?money(-m.amount):'—'}</td><td>${esc(m.actor||'No registrado')}</td></tr>`).join('')||'<tr><td colspan="6">Sin movimientos para esta selección.</td></tr>'}</tbody></table></div>`}
function cashPage(){const selected=cashViewId==='current'?cashSessions.find(s=>s.id===currentCashId):cashSessions.find(s=>String(s.id)===cashViewId),rows=selected?(selected.movementSnapshot||sessionMoves(selected.id)):[],pending=appointments.filter(a=>a.status==='Completada'&&a.paid<a.price);$('#main').innerHTML=heading('Caja y arqueos','Control de efectivo, pagos digitales y movimientos por apertura.',`<button class="primary" onclick="cashAction()">${cashOpen?'Arqueo y cierre':'Abrir caja'}</button>`)+`<div class="stats">${stat('Caja actual',cashOpen?'Abierta':'Cerrada',cashOpen?stamp(cashSessions.find(s=>s.id===currentCashId)?.openedAt):'Selecciona un cierre para consultar')}${stat('Efectivo esperado',cashOpen?money(cashExpected()):'—','Fondo + entradas en efectivo − salidas')}${stat('QR neto actual',cashOpen?money(methodNet(currentCashId,'QR (registro manual)')):'—','Registro manual, separado del efectivo')}${stat('Total esperado de caja',cashOpen?money(cashExpected()+methodNet(currentCashId,'QR (registro manual)')+methodNet(currentCashId,'Transferencia (registro manual)')):'—','Fondo + efectivo neto + pagos digitales')}</div><section class="panel"><div class="panelhead"><h2>Historial completo de movimientos</h2><div class="filters"><select aria-label="Caja consultada" onchange="cashViewId=this.value;cashPage()"><option value="current">Caja actual / última apertura</option>${cashSessions.slice().reverse().map(x=>`<option value="${x.id}" ${cashViewId===String(x.id)?'selected':''}>${x.date} · ${x.id} · ${x.closed?'Cerrada':'Abierta'}</option>`).join('')}</select><select aria-label="Medio de pago" onchange="cashMethod=this.value;cashPage()">${['Todos','Efectivo','QR (registro manual)','Transferencia (registro manual)'].map(x=>`<option ${cashMethod===x?'selected':''}>${x}</option>`).join('')}</select><button onclick="expenseForm()">Registrar gasto</button>${selected?`<button onclick="cashReport(${selected.id})">Descargar arqueo</button>`:''}</div></div>${selected?`<div style="padding:18px"><b>Apertura: ${money(selected.opening)}</b> · ${stamp(selected.openedAt)} · ${esc(selected.openedBy||'Perfil no registrado')}${selected.closed?`<p>Cierre: ${stamp(selected.closedAt)} · ${esc(selected.closedBy||'Perfil no registrado')}<br>Esperado ${money(selected.expected)} · Contado ${money(selected.counted)} · <b>${differenceLabel(selected.diff)}</b><br>Motivo: ${esc(selected.reason||'Sin diferencia')}</p>`:''}<p>${['Efectivo','QR (registro manual)','Transferencia (registro manual)'].map(type=>esc(type)+': '+money(rows.filter(m=>m.type===type).reduce((n,m)=>n+m.amount,0))).join(' · ')}</p>${(selected.digital||[]).map(d=>`<p>${esc(d.type)}: registrado ${money(d.expected)} · ${d.reviewed===null?'Sumado automáticamente desde movimientos; sin verificación bancaria':'revisado '+money(d.reviewed)+' · '+differenceLabel(d.diff)}</p>`).join('')}<details><summary>Ver conteo de apertura y cierre</summary>${denomSummary(selected.openingCounts,'Apertura')}${denomSummary(selected.closingCounts,'Cierre')}</details></div>`:'<p style="padding:20px">Abre una caja o selecciona una del historial.</p>'}${cashLedger(rows.filter(m=>cashMethod==='Todos'||m.type===cashMethod).slice().reverse())}</section><h2 class="subhead">Atenciones pendientes de cobro</h2><section class="panel">${pending.map(a=>`<div class="panelhead"><span>${esc(name(a))} · ${a.date} · ${money(a.price-a.paid)}</span><button onclick="paymentForm(${a.id})">Cobrar</button></div>`).join('')||'<p style="padding:20px">Sin saldos pendientes.</p>'}</section><p class="metrichelp">Las aperturas históricas de ejemplo no tienen hora ni conteo detallado. Las nuevas aperturas y movimientos sí lo registran. El perfil mostrado aún no identifica una cuenta autenticada. El guardado permanente está pendiente de conexión.</p>`}
function denomSummary(counts,title){return `<p><b>${title}</b><br>${counts?counts.map(x=>x.amount!==undefined?esc(x.label)+': '+money(x.amount):money(x.value)+' × '+x.qty+' = '+money(x.value*x.qty)).join('<br>'):'Conteo no registrado'}</p>`}
function legacy_cashReport(id){const s=cashSessions.find(x=>x.id===id);if(!s)return;download('arqueo-'+id+'.json',JSON.stringify({tipo:'Arqueo interno',timezone:'America/La_Paz',caja:s,movimientos:s.movementSnapshot||sessionMoves(id),nota:'Registro de sesión. No constituye verificación bancaria ni respaldo con restauración.'},null,2),'application/json');notify('Arqueo y movimientos descargados')}

function paymentForm(id){if(role==='Barbero')return notify('Este perfil no registra cobros.');const a=appointments.find(x=>x.id===id);if(!a||['Cancelada','No asistió'].includes(a.status))return notify('Esta cita no admite cobros.');if(!cashOpen)return notify('Abre la caja antes de cobrar.');modal('Cobrar servicio',`<h3>${esc(name(a))}</h3>${paymentSummary(a)}`+field('Importe recibido ahora (Bs)',input('amount','number',round(a.price-a.paid),'required min="0" step="0.01"'))+field('Medio de pago',paymentMethods())+(a.status!=='Completada'?'<label class="inlinecheck"><input name="complete" type="checkbox">El servicio ya terminó</label>':'')+'<p class="formhint">El anticipo ya está descontado del saldo. Marca que terminó solo si el cliente fue atendido; cobrar por adelantado no completa la cita. QR y transferencia se registran manualmente.</p>',f=>{const amount=Number(f.get('amount')),method=f.get('method'),complete=f.has('complete')&&a.status!=='Completada';if(!cashOpen)throw Error('La caja está cerrada.');if(!Number.isFinite(amount)||amount<0||amount>round(a.price-a.paid)||Math.abs(amount*100-Math.round(amount*100))>0.00001)throw Error('Revisa el importe: no puede superar el saldo.');if(amount===0&&!complete)throw Error('Ingresa un pago o confirma que el servicio terminó.');if(!['Efectivo','QR (registro manual)','Transferencia (registro manual)'].includes(method))throw Error('Selecciona el medio de pago.');if(complete){a.status='Completada';a.commissionSnapshot=a.commissionSnapshot||{rate:commissionRules[a.barber]?.rate||0,base:'cobrado neto de devoluciones'};logAction('Servicio finalizado desde cobro',id)}if(amount>0){a.paid=round(a.paid+amount);movements.push({id:uuidNumber(),at:new Date().toISOString(),actor:role,date:localCashDate(),amount,type:method,note:(a.status==='Completada'?'Cobro':'Anticipo')+' · '+name(a),appointment:id,kind:a.status==='Completada'?'payment':'deposit',session:currentCashId});logAction('Pago '+money(amount)+' · '+method,id)}finish('Registro guardado · saldo '+money(a.price-a.paid))})}
function paymentMethods(){return '<select name="method"><option>Efectivo</option><option>QR (registro manual)</option><option>Transferencia (registro manual)</option></select>'}
function productSalesPage(){if(role==='Barbero')return;$('#main').innerHTML=heading('Venta de productos','Selecciona un producto para registrar su venta y cobro.')+`<div class="cards">${inventory.map(p=>`<article class="card"><h2>${esc(p.name)}</h2><strong class="price">${money(p.price)}</strong><p>Disponible: ${stock(p.id)} unidades</p><button class="primary" ${stock(p.id)<=0?'disabled':''} onclick="sellProduct(${p.id})">Vender producto</button></article>`).join('')||'<p>No hay productos. Agrégalos desde Inventario.</p>'}</div><h2 class="subhead">Ventas registradas</h2><section class="panel">${cashLedger(movements.filter(m=>m.kind==='sale').slice().reverse())}</section>`}
function sellProduct(id){if(role==='Barbero')return notify('Perfil sin acceso a ventas.');if(!cashOpen)return notify('Abre la caja antes de vender.');const p=inventory.find(x=>x.id===id);if(!p)return;modal('Vender · '+p.name,`<p>Precio unitario: <b>${money(p.price)}</b> · disponibles ${stock(id)}</p>`+field('Barbero que recibe la comisión',`<select name="saleBarber" required><option value="">Selecciona un barbero</option>${activeStaff().map(b=>`<option value="${b.id}">${esc(b.name)} · ${productRates[b.id]===undefined?'Comisión sin configurar':productRates[b.id]+'%'}</option>`).join('')}</select>`)+field('Cantidad',input('qty','number',1,'required min="1" step="1"'))+field('Medio de pago',paymentMethods())+'<div class="quote" id="saleTotal"></div><p class="formhint">Se cobra el total y se descuenta del inventario al guardar. QR y transferencia requieren revisión manual.</p>',f=>{const qty=Number(f.get('qty')),method=f.get('method');if(!cashOpen)throw Error('La caja está cerrada.');if(!Number.isSafeInteger(qty)||qty<=0||qty>stock(id))throw Error('Revisa la cantidad y la existencia disponible.');if(!['Efectivo','QR (registro manual)','Transferencia (registro manual)'].includes(method))throw Error('Selecciona el medio de pago.');const raw=f.get('saleBarber'),barber=Number(raw);if(raw==null||raw===''||!schedules[barber]?.active)throw Error('Selecciona el barbero que recibe la comisión.');if(productRates[barber]===undefined)throw Error('El propietario debe configurar la comisión de productos en Comisiones.');const rate=productRates[barber];const saleId=uuidNumber(),amount=round(qty*p.price),at=new Date().toISOString();stockLedger.push({id:uuidNumber(),product:id,delta:-qty,kind:'Venta',reason:'Venta '+saleId,date:localCashDate(),saleId});movements.push({id:saleId,at,actor:role,date:localCashDate(),amount,type:method,note:'Venta · '+p.name+' × '+qty+' · Comisión para '+barbers[barber],kind:'sale',product:id,quantity:qty,unitPrice:p.price,barber,commissionRate:rate,commissionAmount:round(amount*rate/100),session:currentCashId});logAction('Venta '+p.name+' × '+qty+' · '+money(amount));finish('Venta registrada: '+money(amount))});const refresh=()=>{const qty=Number($('#form [name=qty]')?.value||1);$('#saleTotal').textContent='Total a cobrar: '+money(round(qty*p.price))};$('#fields').oninput=refresh;refresh()}

function reportTable(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>`<tr>${row.map(v=>`<td>${esc(String(v??'—'))}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">Sin registros.</td></tr>`}</tbody></table>`}
function reportFacts(items){return `<div class="facts">${items.map(([label,value])=>`<div><span>${esc(label)}</span><strong>${esc(String(value))}</strong></div>`).join('')}</div>`}
function reportDocument(title,subtitle,body){return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(title)} · The Barber</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f5;color:#1c2c39;font:14px/1.55 Arial,sans-serif}.paper{max-width:1100px;margin:30px auto;padding:42px;background:white;border-radius:12px;box-shadow:0 8px 35px #172d4014}header{border-bottom:3px solid #b68a46;padding-bottom:22px;margin-bottom:26px}.brand{font-size:15px;letter-spacing:3px;font-weight:bold;color:#725429}h1{font-size:29px;line-height:1.2;margin:18px 0 8px}h2{font-size:18px;margin:30px 0 12px}p{margin:8px 0}.muted,header p{color:#617383}.toolbar{max-width:1100px;margin:20px auto;padding:0 12px;display:flex;align-items:center;gap:15px}.toolbar button{border:0;background:#183c53;color:white;border-radius:7px;padding:13px 20px;cursor:pointer;font-weight:bold}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.facts>div{background:#f3f6f8;border:1px solid #e1e7ed;border-radius:8px;padding:14px}.facts span{display:block;font-size:12px;color:#5e7282}.facts strong{display:block;margin-top:4px;font-size:17px;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;margin:12px 0 24px;font-size:12px;table-layout:fixed}th{background:#183c53;color:white;text-align:left;padding:10px}td{padding:9px;border-bottom:1px solid #e0e6eb;vertical-align:top;overflow-wrap:anywhere}tr:nth-child(even) td{background:#f7f9fb}.note{background:#fff7e7;border-left:3px solid #bb934c;padding:13px;margin:20px 0}.result{font-size:20px;font-weight:bold;padding:16px;background:#edf4f8;border-radius:8px}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:45px;margin:50px 0 20px}.signatures div{border-top:1px solid #9eabb6;padding-top:8px}footer{border-top:1px solid #dce3e8;padding-top:15px;margin-top:32px;color:#637583;font-size:11px}@media(max-width:650px){.paper{margin:10px;padding:18px}.facts{grid-template-columns:1fr 1fr}table{font-size:10px}td,th{padding:6px}.toolbar{flex-wrap:wrap}}@page{size:A4;margin:14mm}@media print{body{background:white;font-size:11px}.paper{max-width:none;margin:0;padding:0;box-shadow:none;border-radius:0}.toolbar{display:none}h1{font-size:24px}thead{display:table-header-group}tr,.facts>div,.signatures{break-inside:avoid}h2{break-after:avoid}th{color:#172f43;background:#e4ecf2}table{font-size:10px}footer{font-size:9px}}</style></head><body><div class="toolbar"><button onclick="window.print()">Imprimir / Guardar como PDF</button><span>Abre este documento en tu navegador. Para PDF, selecciona «Guardar como PDF» al imprimir.</span></div><main class="paper"><header><div class="brand">BARBE SHOP</div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p><p>Local principal · Bolivia · Importes en bolivianos (Bs)</p></header>${body}<footer>Emitido: ${esc(stamp(new Date().toISOString()))} · Hora de Bolivia<br>Documento interno. No es factura fiscal. Contiene registros de una sesión con datos de ejemplo; no acredita verificación bancaria ni reemplaza un respaldo del sistema.</footer></main></body></html>`}
function saveReport(filename,title,subtitle,body){download(filename+'.html',reportDocument(title,subtitle,body),'text/html;charset=utf-8');notify('Informe descargado. Ábrelo en el navegador para leer, imprimir o guardar como PDF.')}
function movementReport(rows){return reportTable(['Fecha y hora','Concepto','Medio','Entrada (Bs)','Salida (Bs)','Perfil'],rows.map(m=>[m.at?stamp(m.at):m.date+' · hora no registrada',m.note+' · Ref. '+m.id,m.type,m.amount>0?money(m.amount):'—',m.amount<0?money(-m.amount):'—',m.actor||'No registrado']))}
function countsReport(counts){return counts?reportTable(['Tipo de efectivo','Importe'],counts.map(x=>x.amount!==undefined?[x.label,money(x.amount)]:[money(x.value)+' × '+x.qty,money(x.value*x.qty)])):'<p class="muted">Desglose no registrado.</p>'}
function cashReport(id){const s=cashSessions.find(x=>x.id===id);if(!s||role==='Barbero')return;const rows=s.movementSnapshot||sessionMoves(id),methods=['Efectivo','QR (registro manual)','Transferencia (registro manual)'];const net=type=>round(rows.filter(m=>m.type===type).reduce((n,m)=>n+m.amount,0)),expected=round(s.opening+net('Efectivo')),digital=round(net(methods[1])+net(methods[2]));saveReport('arqueo-'+id,s.closed?'Arqueo y cierre de caja':'Estado de caja abierta','Caja '+id+' · '+(s.closed?'Cierre registrado':'Informe provisional: aún no se cerró'),reportFacts([['Apertura',stamp(s.openedAt)],['Cierre',s.closed?stamp(s.closedAt):'Caja abierta'],['Fondo inicial',money(s.opening)],['Efectivo esperado',money(s.closed?s.expected:expected)],['Efectivo contado',s.closed?money(s.counted):'Pendiente de arqueo'],['Diferencia en efectivo',s.closed?differenceLabel(s.diff):'Sin cierre']])+`<p>Apertura registrada por: <b>${esc(s.openedBy||'No registrado')}</b> · Cierre: <b>${esc(s.closedBy||'Pendiente / no registrado')}</b></p><h2>Resumen por medio de pago</h2>`+reportTable(['Medio','Entradas','Salidas','Neto'],methods.map(type=>{const list=rows.filter(m=>m.type===type);return [type,money(list.filter(m=>m.amount>0).reduce((n,m)=>n+m.amount,0)),money(-list.filter(m=>m.amount<0).reduce((n,m)=>n+m.amount,0)),money(net(type))]}))+reportFacts([['Total neto de movimientos',money(rows.reduce((n,m)=>n+m.amount,0))],['Fondo + efectivo neto + digitales',money(expected+digital)],['Efectivo contado + digitales registrados',s.closed?money(s.counted+digital):'Pendiente de cierre']])+`<div class="note">El fondo inicial no es una venta. Efectivo esperado = fondo inicial + entradas en efectivo − salidas en efectivo. Los totales digitales son registros manuales; sumarlos al efectivo no verifica que hayan llegado al banco.</div><h2>Pagos digitales calculados desde los movimientos</h2>`+reportTable(['Medio','Registrado','Revisado manualmente','Resultado'],(s.digital||methods.slice(1).map(type=>({type,expected:net(type),reviewed:null}))).map(d=>[d.type,money(d.expected),d.reviewed===null?'Sin revisar':money(d.reviewed),d.reviewed===null?'Pendiente':differenceLabel(d.diff)]))+`<h2>Efectivo de apertura</h2>`+countsReport(s.openingCounts)+`<h2>Efectivo de cierre</h2>`+countsReport(s.closingCounts)+`<h2>Observaciones</h2><p>Apertura: ${esc(s.openingNote||'Sin observaciones')}</p><p>Cierre: ${esc(s.reason||'Sin observaciones registradas')}</p><h2>Detalle de todos los movimientos (${rows.length})</h2>`+movementReport(rows)+`<div class="signatures"><div>Responsable de caja · firma</div><div>Revisado por · firma</div></div>`)}
function receipt(id){const a=appointments.find(x=>x.id===id);if(!a||role==='Barbero')return;saveReport('comprobante-'+id,'Comprobante interno','Cita '+id+' · No es factura fiscal',reportFacts([['Cliente',name(a)],['Profesional',barbers[a.barber]],['Atención',displayDate(a.date)+' · '+timeLabel(a.time)],['Total del servicio',money(a.price)],['Abonado neto',money(a.paid)],['Saldo pendiente',money(a.price-a.paid)]])+`<h2>Servicio</h2><p>${esc(a.serviceName)}</p><p>Estado de atención: ${esc(a.status)}</p><h2>Pagos y devoluciones</h2>`+movementReport(movements.filter(m=>m.appointment===id)))}
function appointmentReport(rows){return reportTable(['Fecha / hora','Cliente','Profesional / servicio','Estado','Total','Abonado','Saldo'],rows.map(a=>[displayDate(a.date)+' '+timeLabel(a.time),name(a),barbers[a.barber]+' / '+a.serviceName,a.status,money(a.price),money(a.paid),money(a.price-a.paid)]))}
function statsReport(){if(role==='Barbero')return;const m=metrics(reportFrom,reportTo);saveReport('estadisticas-'+reportFrom+'-'+reportTo,'Informe de actividad',displayDate(reportFrom)+' al '+displayDate(reportTo)+' · Profesional: '+(filter==='Todos'?'Todo el equipo':barbers[+filter])+' · Servicio: '+(serviceFilter==='Todos'?'Todos':services[+serviceFilter]?.name||serviceFilter),reportFacts([['Cobrado neto de servicios',money(m.income)],['Atenciones completadas',m.done.length],['Clientes atendidos',m.clients],['Cancelaciones',m.cancel],['Ausencias',m.absent],['Descuentos en atenciones',money(m.discount)]])+`<div class="note">Cobrado neto por fecha del movimiento, descontando devoluciones. No incluye fondo inicial ni ventas de productos. Los ingresos no equivalen a ganancias.</div><h2>Citas del período</h2>`+appointmentReport(m.rows))}
function exportDemo(){if(role!=='Propietario')return;saveReport('registros-barbe-shop','Registro general de operaciones','Datos disponibles en esta sesión',reportFacts([['Clientes',clients.length],['Citas',appointments.length],['Movimientos',movements.length]])+`<h2>Citas</h2>`+appointmentReport(appointments)+`<h2>Movimientos de caja</h2>`+movementReport(movements)+`<h2>Clientes</h2>`+reportTable(['Nombre','Teléfono','Notas'],clients.map(c=>[c.name,c.phone||'No registrado',c.notes||'—']))+`<h2>Inventario actual</h2>`+reportTable(['Producto','Precio unitario','Existencias'],inventory.map(p=>[p.name,money(p.price),stock(p.id)]))+`<h2>Aperturas y cierres</h2>`+reportTable(['Caja','Apertura','Fondo','Cierre','Contado','Diferencia'],cashSessions.map(s=>[s.id,stamp(s.openedAt),money(s.opening),s.closed?stamp(s.closedAt):'Abierta',s.closed?money(s.counted):'—',s.closed?differenceLabel(s.diff):'—']))+`<h2>Promociones</h2>`+reportTable(['Nombre','Vigencia','Horario','Beneficio','Estado'],promos.map(p=>[p.name,p.from+' a '+p.to,p.start+'–'+p.end,promoDescription(p),promoState(p)]))+`<h2>Comisiones liquidadas</h2>`+reportTable(['Fecha','Profesional','Importe'],settlements.map(x=>[x.date,barbers[x.barber],money(x.total)]))+`<h2>Actividad registrada</h2>`+reportTable(['Fecha / hora','Acción','Perfil'],historyLog.map(x=>[stamp(x.time),x.title,x.role])))}

function qrCloseSummary(id,counted){const rows=sessionMoves(id).filter(m=>m.type==='QR (registro manual)'),received=round(rows.filter(m=>m.amount>0).reduce((n,m)=>n+m.amount,0)),returned=round(-rows.filter(m=>m.amount<0).reduce((n,m)=>n+m.amount,0)),net=round(received-returned),transfer=methodNet(id,'Transferencia (registro manual)');return `<div class="quote"><span>QR cobrado en esta caja · automático</span><strong>${money(net)}</strong><small>Cobros: ${money(received)} · Devoluciones: ${money(returned)} · ${rows.length} movimientos</small></div><div class="quote"><span>Total de cierre: efectivo contado + QR${transfer?' + otros pagos registrados':''}</span><strong>${money(round(counted+net+transfer))}</strong><small>Billetes y monedas: ${money(counted)} · QR: ${money(net)}${transfer?' · Otros pagos registrados: '+money(transfer):''}<br>Incluye el fondo inicial que permanece en efectivo. El faltante o sobrante se calcula comparando el efectivo contado con el esperado.</small></div>`}

function commissionDates(){const start=commissionPeriod==='week'?shiftDate(today,-((dayOf(today)+6)%7)):commissionPeriod==='month'?today.slice(0,7)+'-01':commissionPeriod==='all'?'0000-01-01':today;const end=commissionPeriod==='week'?shiftDate(start,6):commissionPeriod==='month'?shiftDate(shiftDate(start,32).slice(0,7)+'-01',-1):commissionPeriod==='all'?'9999-12-31':today;return {start,end}}
function commissionItems(i){const {start,end}=commissionDates();return [...appointments.filter(a=>a.barber===i&&a.status==='Completada'&&a.date>=start&&a.date<=end).map(a=>({appointment:a.id,earned:earned(a),amount:round(earned(a)-paidCommission(a.id))})),...movements.filter(m=>m.kind==='sale'&&m.barber===i&&m.date>=start&&m.date<=end).map(m=>{const paid=settlements.flatMap(s=>s.items).filter(x=>x.sale===m.id).reduce((n,x)=>n+x.amount,0);return {sale:m.id,earned:m.commissionAmount||0,amount:round((m.commissionAmount||0)-paid)}})]}
function productCommissionForm(i){if(role!=='Propietario')return;modal('Comisión de productos · '+barbers[i],field('Porcentaje por venta',input('rate','number',productRates[i]??'','required min="0" max="100" step="0.01"'))+'<p>Aplica a ventas futuras. Cada venta conserva el porcentaje aceptado. Puedes poner 0 si no corresponde comisión.</p>',f=>{const rate=Number(f.get('rate'));if(f.get('rate')===''||!Number.isFinite(rate)||rate<0||rate>100)throw Error('Indica un porcentaje de 0 a 100.');productRates[i]=rate;logAction('Comisión de productos: '+barbers[i]+' '+rate+'%');finish('Porcentaje guardado')})}
function commissionPage(){const {start,end}=commissionDates();$('#main').innerHTML=heading('Comisiones del equipo','Servicios y productos sumados por profesional.')+`<div class="toolbar"><label>Período <select onchange="commissionPeriod=this.value;commissionPage()">${[['day','Hoy'],['week','Esta semana'],['month','Este mes'],['all','Todo el historial']].map(([v,t])=>`<option value="${v}" ${v===commissionPeriod?'selected':''}>${t}</option>`).join('')}</select></label><span>${commissionPeriod==='all'?'Historial completo':start+' a '+end}</span></div><div class="cards">${barbers.map((b,i)=>{const items=commissionItems(i),services=items.filter(x=>x.appointment).reduce((n,x)=>n+x.earned,0),products=items.filter(x=>x.sale).reduce((n,x)=>n+x.earned,0),pending=items.reduce((n,x)=>n+x.amount,0);return `<article class="card"><h2>${esc(b)}</h2><strong class="price">${money(services+products)}</strong><p>Total generado en el período<br>Servicios: ${money(services)}<br>Productos: ${money(products)}<br>Liquidado: ${money(services+products-pending)}<br><b>Pendiente: ${money(pending)}</b></p><p>Productos: ${productRates[i]===undefined?'Porcentaje pendiente de configurar':productRates[i]+'%'}</p><div class="buttons"><button onclick="commissionForm(${i})">Regla de servicios</button><button onclick="productCommissionForm(${i})">Regla de productos</button><button onclick="settleForm(${i})">Liquidar período</button></div></article>`}).join('')}</div><p class="notice">Las comisiones de servicios se agrupan por fecha de atención; las de productos, por fecha de venta. No incluyen un sueldo fijo. Los cambios de porcentaje no modifican ventas ni liquidaciones anteriores.</p><h2>Liquidaciones</h2>${reportTable(['Fecha','Barbero','Total'],settlements.map(x=>[x.date,barbers[x.barber],money(x.total)]))}`}
function settleForm(i){if(role!=='Propietario')return;const items=commissionItems(i).filter(x=>x.amount!==0),total=round(items.reduce((n,x)=>n+x.amount,0));if(total<=0)return notify('No hay saldo positivo para liquidar en este período.');modal('Liquidar comisiones',`<p>${esc(barbers[i])} · <b>${money(total)}</b></p><p>Incluye servicios y ventas de productos del período seleccionado. Registra la liquidación; no transfiere dinero ni retira efectivo de caja.</p>`,()=>{settlements.push({id:uuidNumber(),date:localCashDate(),barber:i,items,total});logAction('Liquidación de servicios y productos '+barbers[i]+' · '+money(total));finish('Liquidación registrada')})}
</script></body></html>
