function name(a){return clients.find(c=>c.id===a.client)?.name||'Cliente'}
function minutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}function clock(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}

er()"><option value="Todos">Todo el equipo</option>${barbers.map((b,i)=>`<option value="${i}" ${filter===String(i)?'selected':''}>${esc(b)}</option>`).join('')}</select>`:''}<select aria-label="Estado de cita" onchange="statusFilter=this.value;render()">${['Todas','Pendiente','Confirmada','Cliente presente','En servicio','Completada','Cancelada','No asistió'].map(s=>`<option ${s===statusFilter?'selected':''}>${s}</option>`).join('')}</select></div></div>${calendarMode==='week'?weekBoard():`<div class="board" style="grid-template-columns:repeat(${filter!=='Todos'?1:Math.max(1,barbers.filter((_,i)=>!schedules[i].retired||list.some(a=>a.barber===i)).length)},minmax(0,1fr))">${barbers.map((b,i)=>(schedules[i].retired&&!list.some(a=>a.barber===i))||filter!=='Todos'&&+filter!==i?'':`<div class="lane"><div class="barber"><span class="avatar">${esc(b.split(' ').map(n=>n[0]).join(''))}</span><div><b>${esc(b)}</b><small>${ranges(day,i).length? scheduleDay(schedules[i],dayOf(day)).start+'–'+scheduleDay(schedules[i],dayOf(day)).end:'Día libre'} · ${list.filter(a=>a.barber===i).length} citas</small></div></div>${list.filter(a=>a.barber===i).sort((a,b)=>a.time.localeCompare(b.time)).map(bookingCard).join('')||'<div class="empty">Agenda despejada<small>Las nuevas citas aparecerán aquí.</small></div>'}</div>`).join('')}</div>`}<div class="agendaBottom"><span>Las duraciones incluyen el tiempo de preparación configurado.</span><span>Hora de Bolivia · Bs</span></div></section>`}

function base_staffForm(id=null){if(role!=='Propietario')return;if(id!==null&&schedules[id]?.retired)return notify('Este barbero fue retirado del equipo.');const s=schedules[id]||{start:'09:00',end:'18:00',breakStart:'13:00',breakEnd:'14:00',days:[1,2,3,4,5,6],active:true};modal(id===null?'Nuevo barbero':'Editar profesional',field('Nombre',input('name','text',barbers[id]||'','required maxlength="80"'))+'<p>Configura la jornada de cada día. Desmarca Trabaja para dejarlo libre.</p>'+[1,2,3,4,5,6,0].map(d=>{const h=scheduleDay(s,d);return `<fieldset class="daily-schedule"><legend>${dayNames[d]}</legend><label class="inlinecheck"><input type="checkbox" name="d${d}" ${h.enabled?'checked':''}>Trabaja este día</label><div class="two">${field('Entrada',input('start'+d,'time',h.start,'required'))}${field('Salida',input('end'+d,'time',h.end,'required'))}</div><label class="inlinecheck"><input type="checkbox" name="pause${d}" ${h.hasBreak?'checked':''}>Tiene descanso</label><div class="two">${field('Descanso desde',input('bs'+d,'time',h.breakStart,'required'))}${field('Descanso hasta',input('be'+d,'time',h.breakEnd,'required'))}</div></fieldset>`}).join('')+`<label class="inlinecheck"><input type="checkbox" name="active" ${s.active?'checked':''}>Activo para nuevas citas</label><p class="formhint">Si un cambio deja citas pendientes fuera del horario, tendrás que reprogramarlas primero. Horario de 24 horas: 19:00 = 7:00 p. m.</p>`,f=>{const n=String(f.get('name')||'').trim(),weekly={};if(!n)throw Error('Escribe el nombre.');for(const d of [0,1,2,3,4,5,6]){const h={enabled:f.has('d'+d),start:f.get('start'+d),end:f.get('end'+d),hasBreak:f.has('pause'+d),breakStart:f.get('bs'+d),breakEnd:f.get('be'+d)};if(![h.start,h.end,h.breakStart,h.breakEnd].every(v=>/^([01]\d|2[0-3]):[0-5]\d$/.test(v))||h.enabled&&(h.start>=h.end||h.hasBreak&&(h.breakStart<h.start||h.breakEnd>h.end||h.breakStart>=h.breakEnd)))throw Error('Revisa el horario del '+dayNames[d]+'.');weekly[d]=h}const next={start:'09:00',end:'18:00',breakStart:'13:00',breakEnd:'14:00',days:[0,1,2,3,4,5,6].filter(d=>weekly[d].enabled),active:f.has('active'),weekly};if(id!==null){const previous=schedules[id];schedules[id]=next;try{appointments.filter(a=>a.barber===id&&a.date>=today&&!['Completada','Cancelada','No asistió'].includes(a.status)).forEach(a=>validateBooking(a,a.id))}catch{ schedules[id]=previous;throw Error('Hay citas pendientes fuera del nuevo horario. Reprográmalas primero.')}barbers[id]=n}else{barbers.push(n);schedules.push(next)}logAction('Horario por día actualizado: '+n);finish('Horarios guardados')})}
function reportDays(){if(!reportFrom||!reportTo||reportFrom>reportTo)return [];const out=[];let d=new Date(reportFrom+'T12:00:00');for(let n=0;d.toISOString().slice(0,10)<=reportTo&&n<366;n++){out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}return out}

function base_paymentForm(id){const a=appointments.find(a=>a.id===id);if(!cashOpen){notify('Abre la caja antes de registrar el cobro.');navigate('Caja');return}modal('Cobrar atención',`<h3>${esc(name(a))}</h3><p>Saldo: <b>${money(a.price-a.paid)}</b></p>`+field('Importe recibido (Bs)',input('amount','number',(a.price-a.paid).toFixed(2),'required min="0.01" step="0.01"'))+field('Método','<select name="method"><option>Efectivo</option><option>QR (registro manual)</option><option>Transferencia (registro manual)</option></select>')+'<p class="formhint">Puedes registrar un pago parcial. QR y transferencias requieren revisión manual.</p>',f=>{const amount=Math.round(+f.get('amount')*100)/100;if(!cashOpen||!Number.isFinite(amount)||amount<=0||amount>Math.round((a.price-a.paid)*100)/100)throw Error('El importe debe ser positivo y no superar el saldo.');a.paid=Math.round((a.paid+amount)*100)/100;movements.push({id:uuidNumber(),at:new Date().toISOString(),actor:role,date:localCashDate(),amount,type:f.get('method'),note:'Cobro · '+name(a),appointment:id,kind:a.status==='Completada'?'payment':'deposit',session:currentCashId});logAction('Pago de '+money(amount)+' · '+f.get('method'),id);finish('Pago registrado')})}
function legacy_cashAction(){if(!cashOpen){modal('Abrir una nueva caja',field('Fondo inicial en efectivo (Bs)',input('amount','number','0','required min="0" step="0.01"'))+'<p class="formhint">El fondo inicial no es un ingreso por ventas.</p>',f=>{opening=Math.round(+f.get('amount')*100)/100;if(!Number.isFinite(opening)||opening<0)throw Error('Revisa el importe.');currentCashId=uuidNumber();cashSessions.push({id:currentCashId,opening,date:today});cashOpen=true;closed=false;logAction('Apertura de caja: '+money(opening));finish('Caja abierta')})}else{const expected=cashExpected();modal('Cerrar caja',`<p>Efectivo esperado: <b>${money(expected)}</b></p>`+field('Efectivo contado (Bs)',input('amount','number',expected,'required min="0" step="0.01"'))+field('Motivo de diferencia',input('reason','text','','maxlength="180"')),f=>{const counted=Math.round(+f.get('amount')*100)/100;if(!Number.isFinite(counted)||counted<0)throw Error('Revisa el efectivo contado.');const diff=Math.round((counted-expected)*100)/100;if(diff&&!f.get('reason').trim())throw Error('Explica la diferencia de caja.');Object.assign(cashSessions.find(s=>s.id===currentCashId),{expected,counted,diff,reason:f.get('reason'),closed:true});cashOpen=false;closed=true;logAction('Caja cerrada · diferencia '+money(diff));finish('Cierre registrado: '+money(diff)+' de diferencia')})}}

function expenseForm(){if(!cashOpen)return notify('Abre la caja primero.');modal('Registrar gasto en efectivo',field('Concepto',input('note','text','','required maxlength="100"'))+field('Importe (Bs)',input('amount','number','','required min="0.01" step="0.01"')),f=>{const amount=Math.round(+f.get('amount')*100)/100;if(!Number.isFinite(amount)||amount<=0||!f.get('note').trim())throw Error('Revisa el importe y el concepto.');if(amount>cashExpected())throw Error('El gasto supera el efectivo disponible en esta caja.');movements.push({id:uuidNumber(),at:new Date().toISOString(),actor:role,date:localCashDate(),amount:-amount,type:'Efectivo',note:f.get('note').trim(),session:currentCashId});logAction('Gasto: '+money(amount));finish('Gasto registrado')})}
function base_cashPage(){const income=movements.filter(m=>m.amount>0).reduce((s,m)=>s+m.amount,0),pending=appointments.filter(a=>a.status==='Completada'&&a.paid<a.price);$('#main').innerHTML=heading('Caja y cobros','Cada movimiento queda separado de las citas y del fondo inicial.',`<button class="primary" onclick="cashAction()">${cashOpen?'Cerrar caja':'Abrir caja'}</button>`)+`<div class="stats">${stat('Caja actual',cashOpen?'Abierta':'Cerrada',cashOpen?'Lista para registrar movimientos':'Abre una caja para cobrar')}${stat('Cobrado en la muestra',money(income),'Todos los medios de pago')}${stat('Efectivo de caja actual',cashOpen?money(cashExpected()):'—','Fondo + cobros − gastos')}${stat('Pendiente de cobrar',money(pending.reduce((s,a)=>s+a.price-a.paid,0)),'Atenciones finalizadas')}</div><div class="two"><section class="panel"><div class="panelhead"><h2>Atenciones por cobrar</h2></div>${pending.map(a=>`<div class="panelhead"><div><b>${esc(name(a))}</b><p class="muted">${money(a.price-a.paid)} · ${esc(a.serviceName)}</p></div><button onclick="paymentForm(${a.id})">Cobrar</button></div>`).join('')||'<div class="empty">No hay saldos pendientes</div>'}</section><section class="panel"><div class="panelhead"><h2>Movimientos</h2><button onclick="expenseForm()">＋ Gasto</button></div><div class="tablewrap"><table><tbody>${movements.slice().reverse().map(m=>`<tr><td>${esc(m.note)}<small>${esc(m.type)}${!m.session?' · muestra inicial':''}</small></td><td>${money(m.amount)}</td></tr>`).join('')}</tbody></table></div></section></div><h2 class="subhead">Cierres de caja</h2><section class="panel"><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Esperado</th><th>Contado</th><th>Diferencia</th><th>Motivo</th></tr></thead><tbody>${cashSessions.filter(s=>s.closed).map(s=>`<tr><td>${s.date}</td><td>${money(s.expected)}</td><td>${money(s.counted)}</td><td>${money(s.diff)}</td><td>${esc(s.reason)||'Sin diferencia'}</td></tr>`).join('')||'<tr><td colspan="5">Aún no hay cierres function modal(title,fields,save){$('#fields').oninput=null;$('#fields').onchange=null;$('#modalTitle').textContent=title;$('#fields').innerHTML=fields;$('#error').textContent='';$('#form').onsubmit=async e=>{e.preventDefault();const btn=$('#form button[type=submit]');if(btn?.disabled)return;if(btn)btn.disabled=true;try{await save(new FormData(e.target))}catch(err){$('#error').textContent=err.message}finally{if(btn)btn.disabled=false}};$('#modal').showModal()}
function ranges(d,b){const cached=d<today?availabilityHistory[d]?.[b]:null;if(cached)return cached.map(r=>r.slice());const staff=schedules[b];if(!staff||!staff.active)return [];let s=scheduleDay(staff,dayOf(d));if(!s.enabled)return [];const start=minutes(s.start),end=minutes(s.end),bs=minutes(s.breakStart),be=minutes(s.breakEnd);let intervals=s.hasBreak?[[start,Math.min(bs,end)],[Math.max(start,be),end]].filter(([x,y])=>y>x):[[start,end]];for(const block of blocks.filter(x=>x.date===d&&x.barber===b))intervals=intervals.flatMap(([x,y])=>[[x,Math.min(y,block.start)],[Math.max(x,block.end),y]].filter(([a,z])=>z>a));return intervals}
function overlaps(a,b){return a.date===b.date&&a.barber===b.barber&&minutes(a.time)<minutes(b.time)+b.duration+(b.prep||0)&&minutes(a.time)+a.duration+(a.prep||0)>minutes(b.time)}
function validateBooking(a,ignore=null){if(!/^\d{4}-\d{2}-\d{2}$/.test(a.date)||!/^\d{2}:\d{2}$/.test(a.time))throw Error('Fecha u hora no válidas.');const start=minutes(a.time),end=start+a.duration+(a.prep||0);if(!ranges(a.date,a.barber).some(([x,y])=>start>=x&&end<=y))throw Error('El servicio y su preparación deben quedar dentro del horario y fuera de descansos o bloqueos.');if(appointments.some(b=>b.id!==ignore&&!['Cancelada','No asistió'].includes(b.status)&&overlaps(a,b)))throw Error('Este horario se cruza con otra cita. Elige otro horario.')}
function promoEligible(p,a){const begin=minutes(a.time),finish=begin+a.duration;return p.approved&&!p.paused&&a.date>=p.from&&a.date<=p.to&&p.days.includes(dayOf(a.date))&&p.services.includes(a.service)&&(!p.barbers.length||p.barbers.includes(a.barber))&&begin>=minutes(p.start)&&begin<minutes(p.end)&&(p.rule==='start'||finish<=minutes(p.end))}
function retainedUse(a){return a.promoId&&!(a.status==='Cancelada'&&a.promoSnapshot?.releaseOnCancel)}

function validateDeposit(f,a){const raw=f.get('deposit'),amount=raw===null?0:Number(raw);if(!Number.isFinite(amount)||amount<0||Math.abs(amount*100-Math.round(amount*100))>0.00001)throw Error('Escribe un anticipo válido con hasta dos decimales.');if(amount===0)return 0;if(role==='Barbero')throw Error('Este perfil no registra cobros.');if(!cashOpen)throw Error('Abre la caja antes de registrar el anticipo. Puedes guardar la cita con anticipo 0.');if(amount>round(a.price-a.paid))throw Error('El anticipo no puede superar el saldo.');if(!['Efectivo','QR (registro manual)','Transferencia (registro manual)'].includes(f.get('depositMethod')))throw Error('Selecciona el medio de pago.');return amount}

function reminderDue(a,now=Date.now()){if(!['Pendiente','Confirmada'].includes(a.status))return false;const delta=new Date(a.date+'T'+a.time+':00-04:00').getTime()-now;return delta>=0&&delta<=3600000}

function freeRanges(date,barber,now=Date.now()){if(!schedules[barber]?.active)return [];let free=ranges(date,barber);for(const a of appointments.filter(a=>a.date===date&&a.barber===barber&&!['Cancelada','No asistió'].includes(a.status))){const start=minutes(a.time),end=start+a.duration+(a.prep||0);free=free.flatMap(([x,y])=>[[x,Math.min(y,start)],[Math.max(x,end),y]].filter(([l,r])=>r>l))}const midnight=Date.parse(date+'T00:00:00-04:00'),cutoff=Math.max(0,Math.ceil((now-midnight)/60000/5)*5);return free.map(([x,y])=>[Math.max(x,cutoff),y]).filter(([x,y])=>y>x)}
function availableStarts(date,barber,service,now=Date.now()){const s=services[service];if(!s?.active)return [];const duration=s.duration+(s.prep||0);return freeRanges(date,barber,now).flatMap(([x,y])=>{const starts=[];for(let n=Math.ceil(x/5)*5;n+duration<=y;n+=5)starts.push(n);return starts})}
function availabilityPanel(){if(!services[availabilityService]?.active)availabilityService=services.findIndex(s=>s.active);const service=services[availabilityService],start=calendarMode==='week'?shiftDate(day,-((dayOf(day)+6)%7)):day;const dates=Array.from({length:calendarMode==='week'?7:1},(_,i)=>shiftDate(start,i));const staff=activeStaff().filter(b=>(filter==='Todos'||b.id===+filter));return `<section class="panel availability-panel"><div class="panelhead"><div><h2>Espacios disponibles</h2><p class="muted">Elige servicio y profesional; abre una franja para reservar.</p></div><label>Servicio<select aria-label="Servicio para disponibilidad" onchange="availabilityService=+this.value;render()">${services.map((s,i)=>s.active?`<option value="${i}" ${i===availabilityService?'selected':''}>${esc(s.name)} · ${s.duration+(s.prep||0)} min</option>`:'').join('')}</select></label></div><div class="availability-grid ${calendarMode==='week'?'availability-week':''}">${dates.map(date=>`<div class="availability-day"><h3>${new Date(date+'T12:00:00-04:00').toLocaleDateString('es-BO',{weekday:'short',day:'numeric',month:'short',timeZone:'America/La_Paz'})}</h3>${staff.map(b=>{const free=freeRanges(date,b.id).filter(([x,y])=>service&&y-x>=service.duration+(service.prep||0));return `<div class="availability-staff"><b>${esc(b.name)}</b>${free.length?free.map(([x,y])=>`<details><summary>${timeLabel(clock(x))}–${timeLabel(clock(y))}</summary><div class="slot-buttons">${availableStarts(date,b.id,availabilityService).filter(n=>n>=x&&n<y).map(n=>`<button onclick="bookFreeSlot('${date}',${b.id},${availabilityService},'${clock(n)}')">${timeLabel(clock(n))}</button>`).join('')}</div></details>`).join(''):'<small>Sin espacio para este servicio</small>'}</div>`}).join('')||'<p>No hay profesionales activos.</p>'}</div>`).join('')}</div><p class="metrichelp" style="padding:0 20px 16px">Horarios de Bolivia. Se descuentan citas, preparación, descansos y bloqueos. Solo se muestran espacios futuros donde cabe el servicio completo. El filtro de estado no libera horarios ocupados.</p></section>`}

function localCashDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/La_Paz',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function stamp(at){return at?new Date(at).toLocaleString('es-BO',{timeZone:'America/La_Paz',hour12:true}):'Hora no registrada'}
function countCash(f){const counts=['bills','coins'].map((key,i)=>{const amount=Number(f.get(key)||0);if(!Number.isFinite(amount)||amount<0||amount>100000000||Math.abs(amount*100-Math.round(amount*100))>0.00001)throw Error('Ingresa importes no negativos con hasta dos decimales.');return {label:i?'Monedas':'Billetes',amount:round(amount)}});return {counts,total:round(counts.reduce((n,x)=>n+Math.round(x.amount*100),0)/100)}}
function countFields(){return `<h3>Efectivo disponible</h3><div class="two">${field('Importe en billetes (Bs)',input('bills','number',0,'required min="0" max="100000000" step="0.01" inputmode="decimal"'))}${field('Importe en monedas (Bs)',input('coins','number',0,'required min="0" max="100000000" step="0.01" inputmode="decimal"'))}</div><p class="formhint">Escribe cuánto dinero hay en billetes y cuánto en monedas. El total se calcula automáticamente.</p><div class="quote" id="cashCountPreview" aria-live="polite"></div>`}

function cashAction(){if(role==='Barbero')return notify('Perfil sin acceso a caja.');const closing=cashOpen,id=currentCashId;modal(closing?'Arqueo y cierre de caja':'Apertura de caja',(closing?tipCloseReport(sessionMoves(id))+(cashTipsPending(id).length?'<p>Entrega las propinas en efectivo antes de contar el dinero restante.</p><label class="inlinecheck"><input type="checkbox" name="tipsDelivered" required>Confirmo la entrega de las propinas en efectivo a los barberos</label>':''):'')+countFields()+(closing?'<div id="digitalCloseSummary"></div>':'')+field('Observaciones / motivo de diferencia',input('reason','text','','maxlength="300"'))+'<p class="formhint">El QR se suma desde los cobros registrados, sin volver a ingresarlo al cerrar. No verifica el banco. El fondo inicial no es una venta.</p>',f=>{if(closing!==cashOpen||(closing&&id!==currentCashId))throw Error('La caja cambió. Vuelve a abrir el formulario.');const count=countCash(f),at=new Date().toISOString(),reason=String(f.get('reason')||'').trim();if(!closing){opening=count.total;currentCashId=uuidNumber();cashSessions.push({id:currentCashId,date:localCashDate(),opening,openingCounts:count.counts,openedAt:at,openedBy:role,openingNote:reason,closed:false});cashOpen=true;closed=false;cashViewId='current';logAction('Apertura de caja '+money(opening));finish('Caja abierta')}else{const cashTips=round(cashTipsPending(id).reduce((n,m)=>n+m.amount,0));if(cashTips>0&&!f.has('tipsDelivered'))throw Error('Confirma la entrega de las propinas en efectivo antes de cerrar.');if(cashTips>cashExpected())throw Error('No hay efectivo suficiente para entregar las propinas.');const expected=round(cashExpected()-cashTips),diff=round(count.total-expected);const digital=['QR (registro manual)','Transferencia (registro manual)'].map(type=>({type,expected:methodNet(id,type),reviewed:null,diff:null,source:'movimientos'}));if(diff&&!reason)throw Error('Explica la diferencia del efectivo contado.');payCashTipsAtClose(id,at);Object.assign(cashSessions.find(x=>x.id===id),{expected,counted:count.total,closingCounts:count.counts,diff,reason,closed:true,closedAt:at,closedBy:role,digital,qrNet:methodNet(id,'QR (registro manual)'),closingTotal:round(count.total+digital.reduce((n,d)=>n+d.expected,0)),movementSnapshot:structuredClone(sessionMoves(id))});cashOpen=false;closed=true;cashViewId=String(id);logAction('Cierre de caja · '+differenceLabel(diff));finish(differenceLabel(diff))}});const update=()=>{try{const c=countCash(new FormData($('#form')));if(closing)$('#digitalCloseSummary').innerHTML=qrCloseSummary(id,c.total);$('#cashCountPreview').innerHTML=`<span>Efectivo contado</span><strong>${money(c.total)}</strong>${closing?`<small>Esperado después de entregar propinas: ${money(cashExpected()-cashTipsPending(id).reduce((n,m)=>n+m.amount,0))} · ${differenceLabel(round(c.total-cashExpected()+cashTipsPending(id).reduce((n,m)=>n+m.amount,0)))}</small>`:'<small>Este será el fondo inicial de la caja.</small>'}`}catch(e){$('#cashCountPreview').textContent=e.message}};$('#fields').oninput=update;update()}
function cashLedger(rows){return `<div class="tablewrap"><table><thead><tr><th>Fecha y hora</th><th>Concepto / referencia</th><th>Medio</th><th>Entrada</th><th>Salida</th><th>Perfil</th></tr></thead><tbody>${rows.map(m=>`<tr><td>${m.at?stamp(m.at):esc(m.date)+' · hora no registrada'}</td><td>${esc(m.note)}<small>Movimiento ${m.id}${m.appointment?' · Cita '+m.appointment:''}</small></td><td>${esc(m.type)}</td><td>${m.amount>0?money(m.amount):'—'}</td><td>${m.amount<0?money(-m.amount):'—'}</td><td>${esc(m.actor||'No registrado')}</td></tr>`).join('')||'<tr><td colspan="6">Sin movimientos para esta selección.</td></tr>'}</tbody></table></div>`}
function cashPage(){const selected=cashViewId==='current'?cashSessions.find(s=>s.id===currentCashId):cashSessions.find(s=>String(s.id)===cashViewId),rows=selected?(selected.movementSnapshot||sessionMoves(selected.id)):[],pending=appointments.filter(a=>a.status==='Completada'&&a.paid<a.price);$('#main').innerHTML=heading('Caja y arqueos','Control de efectivo, pagos digitales y movimientos por apertura.',`<button class="primary" onclick="cashAction()">${cashOpen?'Arqueo y cierre':'Abrir caja'}</button>`)+`<div class="stats">${stat('Caja actual',cashOpen?'Abierta':'Cerrada',cashOpen?stamp(cashSessions.find(s=>s.id===currentCashId)?.openedAt):'Selecciona un cierre para consultar')}${stat('Efectivo esperado',cashOpen?money(cashExpected()):'—','Fondo + entradas en efectivo − salidas')}${stat('QR neto actual',cashOpen?money(methodNet(currentCashId,'QR (registro manual)')):'—','Registro manual, separado del efectivo')}${stat('Total esperado de caja',cashOpen?money(cashExpected()+methodNet(currentCashId,'QR (registro manual)')+methodNet(currentCashId,'Transferencia (registro manual)')):'—','Fondo + efectivo neto + pagos digitales')}</div><section class="panel"><div class="panelhead"><h2>Historial completo de movimientos</h2><div class="filters"><select aria-label="Caja consultada" onchange="cashViewId=this.value;cashPage()"><option value="current">Caja actual / última apertura</option>${cashSessions.slice().reverse().map(x=>`<option value="${x.id}" ${cashViewId===String(x.id)?'selected':''}>${x.date} · ${x.id} · ${x.closed?'Cerrada':'Abierta'}</option>`).join('')}</select><select aria-label="Medio de pago" onchange="cashMethod=this.value;cashPage()">${['Todos','Efectivo','QR (registro manual)','Transferencia (registro manual)'].map(x=>`<option ${cashMethod===x?'selected':''}>${x}</option>`).join('')}</select><button onclick="expenseForm()">Registrar gasto</button>${selected?`<button onclick="cashReport(${selected.id})">Descargar arqueo</button>`:''}</div></div>${selected?`<div style="padding:18px"><b>Apertura: ${money(selected.opening)}</b> · ${stamp(selected.openedAt)} · ${esc(selected.openedBy||'Perfil no registrado')}${selected.closed?`<p>Cierre: ${stamp(selected.closedAt)} · ${esc(selected.closedBy||'Perfil no registrado')}<br>Esperado ${money(selected.expected)} · Contado ${money(selected.counted)} · <b>${differenceLabel(selected.diff)}</b><br>Motivo: ${esc(selected.reason||'Sin diferencia')}</p>`:''}<p>${['Efectivo','QR (registro manual)','Transferencia (registro manual)'].map(type=>esc(type)+': '+money(rows.filter(m=>m.type===type).reduce((n,m)=>n+m.amount,0))).join(' · ')}</p>${(selected.digital||[]).map(d=>`<p>${esc(d.type)}: registrado ${money(d.expected)} · ${d.reviewed===null?'Sumado automáticamente desde movimientos; sin verificación bancaria':'revisado '+money(d.reviewed)+' · '+differenceLabel(d.diff)}</p>`).join('')}<details><summary>Ver conteo de apertura y cierre</summary>${denomSummary(selected.openingCounts,'Apertura')}${denomSummary(selected.closingCounts,'Cierre')}</details></div>`:'<p style="padding:20px">Abre una caja o selecciona una del historial.</p>'}${tipCloseReport(rows)}${cashLedger(rows.filter(m=>cashMethod==='Todos'||m.type===cashMethod).slice().reverse())}</section><h2 class="subhead">Atenciones pendientes de cobro</h2><section class="panel">${pending.map(a=>`<div class="panelhead"><span>${esc(name(a))} · ${esc(a.date)} · ${money(a.price-a.paid)}</span><button onclick="paymentForm(${a.id})">Cobrar</button></div>`).join('')||'<p style="padding:20px">Sin saldos pendientes.</p>'}</section><p class="metrichelp">Cada apertura, cierre y movimiento conserva su registro. Los cobros QR se suman desde los movimientos y requieren revisión bancaria manual.</p>`}
function denomSummary(counts,title){return `<p><b>${title}</b><br>${counts?counts.map(x=>x.amount!==undefined?esc(x.label)+': '+money(x.amount):money(x.value)+' × '+x.qty+' = '+money(x.value*x.qty)).join('<br>'):'Conteo no registrado'}</p>`}
function legacy_cashReport(id){const s=cashSessions.find(x=>x.id===id);if(!s)return;download('arqueo-'+id+'.json',JSON.stringify({tipo:'Arqueo interno',timezone:'America/La_Paz',caja:s,movimientos:s.movementSnapshot||sessionMoves(id),nota:'Registro de sesión. No constituye verificación bancaria ni respaldo con restauración.'},null,2),'application/json');notify('Arqueo y movimientos descargados')}

function paymentForm(id){if(role==='Barbero')return notify('Este perfil no registra cobros.');const a=appointments.find(x=>x.id===id);if(!a||['Cancelada','No asistió'].includes(a.status))return notify('Esta cita no admite cobros.');if(!cashOpen)return notify('Abre la caja antes de cobrar.');modal('Cobrar servicio',`<h3>${esc(name(a))}</h3>${paymentSummary(a)}`+field('Pago del servicio ahora (Bs)',input('amount','number',round(a.price-a.paid),'required min="0" step="0.01"'))+field('Propina (Bs)',input('tip','number',0,'required min="0" step="0.01"'))+field('Cliente que deja la propina',input('tipClient','text',name(a),'maxlength="80"'))+field('Propina para',`<select name="tipBarber">${barbers.map((b,i)=>`<option value="${i}" ${i===a.barber?'selected':''}>${esc(b)}</option>`).join('')}</select>`)+field('Medio de pago',paymentMethods())+'<p id="paymentTotal" class="quote"></p>'+(a.status!=='Completada'?'<label class="inlinecheck"><input name="complete" type="checkbox">El servicio ya terminó</label>':'')+'<p class="formhint">El anticipo ya está descontado del saldo. Marca que terminó solo si el cliente fue atendido; cobrar por adelantado no completa la cita. QR y transferencia se registran manualmente.</p>',f=>{const amount=Number(f.get('amount')),method=f.get('method'),complete=f.has('complete')&&a.status!=='Completada';if(!cashOpen)throw Error('La caja está cerrada.');if(!Number.isFinite(amount)||amount<0||amount>round(a.price-a.paid)||Math.abs(amount*100-Math.round(amount*100))>0.00001)throw Error('Revisa el importe: no puede superar el saldo.');const tip=Number(f.get('tip')),tipClient=String(f.get('tipClient')||'').trim(),tipBarber=Number(f.get('tipBarber'));if(!Number.isFinite(tip)||tip<0||tip>200000000||Math.abs(tip*100-Math.round(tip*100))>0.00001)throw Error('Revisa el importe de la propina.');if(tip>0&&(!tipClient||tipClient.length>80||!Number.isInteger(tipBarber)||!barbers[tipBarber]))throw Error('Indica cliente y barbero de la propina.');if(amount===0&&tip===0&&!complete)throw Error('Ingresa un pago o confirma que el servicio terminó.');if(!['Efectivo','QR (registro manual)','Transferencia (registro manual)'].includes(method))throw Error('Selecciona el medio de pago.');if(complete){a.status='Completada';logAction('Servicio finalizado desde cobro',id)}if(amount>0){a.paid=round(a.paid+amount);movements.push({id:uuidNumber(),at:new Date().toISOString(),actor:role,date:localCashDate(),amount,type:method,note:(a.status==='Completada'?'Cobro':'Anticipo')+' · '+(a.serviceName||services[a.service].name)+' · Cliente '+name(a)+' · Barbero '+barbers[a.barber],appointment:id,kind:a.status==='Completada'?'payment':'deposit',session:currentCashId});logAction('Pago '+money(amount)+' · '+method,id)}if(tip>0){movements.push({id:uuidNumber(),at:new Date().toISOString(),actor:role,date:localCashDate(),amount:tip,type:method,note:'Propina · Cliente '+tipClient+' · Barbero '+barbers[tipBarber],appointment:id,client:a.client,clientName:tipClient,barber:tipBarber,barberName:barbers[tipBarber],kind:'tip',session:currentCashId});logAction('Propina '+money(tip)+' · '+tipClient+' · '+barbers[tipBarber],id)}finish('Cobrado '+money(amount+tip)+' · saldo del servicio '+money(a.price-a.paid))});const refresh=()=>{$('#paymentTotal').textContent='Total a cobrar: '+money(Number($('#form [name=amount]').value||0)+Number($('#form [name=tip]').value||0))};$('#fields').oninput=refresh;refresh()}
function paymentMethods(){return '<select name="method"><option>Efectivo</option><option>QR (registro manual)</option><option>Transferencia (registro manual)</option></select>'}
function productSalesPage(){if(role==='Barbero')return;$('#main').innerHTML=heading('Venta de productos','Selecciona un producto para registrar su venta y cobro.')+`<div class="cards">${inventory.map(p=>`<article class="card"><h2>${esc(p.name)}</h2><strong class="price">${money(p.price)}</strong><p>Disponible: ${stock(p.id)} unidades</p><button class="primary" ${stock(p.id)<=0?'disabled':''} onclick="sellProduct(${p.id})">Vender producto</button></article>`).join('')||'<p>No hay productos. Agrégalos desde Inventario.</p>'}</div><h2 class="subhead">Ventas registradas</h2><section class="panel">${cashLedger(movements.filter(m=>m.kind==='sale').slice().reverse())}</section>`}
function sellProduct(id){if(role==='Barbero')return notify('Perfil sin acceso a ventas.');if(!cashOpen)return notify('Abre la caja antes de vender.');const p=inventory.find(x=>x.id===id);if(!p)return;modal('Vender · '+p.name,`<p>Precio unitario: <b>${money(p.price)}</b> · disponibles ${stock(id)}</p>`+field('Barbero que registra la venta',`<select name="saleBarber" required><option value="">Selecciona un barbero</option>${activeStaff().map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select>`)+field('Cantidad',input('qty','number',1,'required min="1" step="1"'))+field('Medio de pago',paymentMethods())+'<div class="quote" id="saleTotal"></div><p class="formhint">Se cobra el total y se descuenta del inventario al guardar. QR y transferencia requieren revisión manual.</p>',f=>{const qty=Number(f.get('qty')),method=f.get('method');if(!cashOpen)throw Error('La caja está cerrada.');if(!Number.isSafeInteger(qty)||qty<=0||qty>stock(id))throw Error('Revisa la cantidad y la existencia disponible.');if(!['Efectivo','QR (registro manual)','Transferencia (registro manual)'].includes(method))throw Error('Selecciona el medio de pago.');const raw=f.get('saleBarber'),barber=Number(raw);if(raw==null||raw===''||!schedules[barber]?.active)throw Error('Selecciona el barbero que registra la venta.');const rate=0;const saleId=uuidNumber(),amount=round(qty*p.price),at=new Date().toISOString();stockLedger.push({id:uuidNumber(),product:id,delta:-qty,kind:'Venta',reason:'Venta '+saleId,date:localCashDate(),saleId});movements.push({id:saleId,at,actor:role,date:localCashDate(),amount,type:method,note:'Venta · '+p.name+' × '+qty+' · Barbero '+barbers[barber],kind:'sale',compensationModel:'salary',product:id,quantity:qty,unitPrice:p.price,barber,commissionRate:rate,commissionAmount:round(amount*rate/100),session:currentCashId});logAction('Venta '+p.name+' × '+qty+' · '+money(amount));finish('Venta registrada: '+money(amount))});const refresh=()=>{const qty=Number($('#form [name=qty]')?.value||1);$('#saleTotal').textContent='Total a cobrar: '+money(round(qty*p.price))};$('#fields').oninput=refresh;refresh()}

function reportTable(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>`<tr>${row.map(v=>`<td>${esc(String(v??'—'))}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">Sin registros.</td></tr>`}</tbody></table>`}
function reportFacts(items){return `<div class="facts">${items.map(([label,value])=>`<div><span>${esc(label)}</span><strong>${esc(String(value))}</strong></div>`).join('')}</div>`}
function reportDocument(title,subtitle,body){return `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(title)} · Barak</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f5;color:#1c2c39;font:14px/1.55 Arial,sans-serif}.paper{max-width:1100px;margin:30px auto;padding:42px;background:white;border-radius:12px;box-shadow:0 8px 35px #172d4014}header{border-bottom:3px solid #b68a46;padding-bottom:22px;margin-bottom:26px}.brand{font-size:15px;letter-spacing:3px;font-weight:bold;color:#725429}h1{font-size:29px;line-height:1.2;margin:18px 0 8px}h2{font-size:18px;margin:30px 0 12px}p{margin:8px 0}.muted,header p{color:#617383}.toolbar{max-width:1100px;margin:20px auto;padding:0 12px;display:flex;align-items:center;gap:15px}.toolbar button{border:0;background:#183c53;color:white;border-radius:7px;padding:13px 20px;cursor:pointer;font-weight:bold}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.facts>div{background:#f3f6f8;border:1px solid #e1e7ed;border-radius:8px;padding:14px}.facts span{display:block;font-size:12px;color:#5e7282}.facts strong{display:block;margin-top:4px;font-size:17px;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;margin:12px 0 24px;font-size:12px;table-layout:fixed}th{background:#183c53;color:white;text-align:left;padding:10px}td{padding:9px;border-bottom:1px solid #e0e6eb;vertical-align:top;overflow-wrap:anywhere}tr:nth-child(even) td{background:#f7f9fb}.note{background:#fff7e7;border-left:3px solid #bb934c;padding:13px;margin:20px 0}.result{font-size:20px;font-weight:bold;padding:16px;background:#edf4f8;border-radius:8px}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:45px;margin:50px 0 20px}.signatures div{border-top:1px solid #9eabb6;padding-top:8px}footer{border-top:1px solid #dce3e8;padding-top:15px;margin-top:32px;color:#637583;font-size:11px}@media(max-width:650px){.paper{margin:10px;padding:18px}.facts{grid-template-columns:1fr 1fr}table{font-size:10px}td,th{padding:6px}.toolbar{flex-wrap:wrap}}@page{size:A4;margin:14mm}@media print{body{background:white;font-size:11px}.paper{max-width:none;margin:0;padding:0;box-shadow:none;border-radius:0}.toolbar{display:none}h1{font-size:24px}thead{display:table-header-group}tr,.facts>div,.signatures{break-inside:avoid}h2{break-after:avoid}th{color:#172f43;background:#e4ecf2}table{font-size:10px}footer{font-size:9px}}</style></head><body><div class="toolbar"><button onclick="window.print()">Imprimir / Guardar como PDF</button><span>Abre este documento en tu navegador. Para PDF, selecciona «Guardar como PDF» al imprimir.</span></div><main class="paper"><header><div class="brand">BARAK</div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p><p>Barak · Importes en bolivianos (Bs)</p></header>${body}<footer>Emitido: ${esc(stamp(new Date().toISOString()))} · Hora de Bolivia<br>Documento interno. No es factura fiscal. No acredita verificación bancaria ni reemplaza un respaldo del sistema.</footer></main></body></html>`}
function saveReport(filename,title,subtitle,body){download(filename+'.html',reportDocument(title,subtitle,body),'text/html;charset=utf-8');notify('Informe descargado. Ábrelo en el navegador para leer, imprimir o guardar como PDF.')}
function movementReport(rows){return reportTable(['Fecha y hora','Concepto','Medio','Entrada (Bs)','Salida (Bs)','Perfil'],rows.map(m=>[m.at?stamp(m.at):m.date+' · hora no registrada',m.note+' · Ref. '+m.id,m.type,m.amount>0?money(m.amount):'—',m.amount<0?money(-m.amount):'—',m.actor||'No registrado']))}
function countsReport(counts){return counts?reportTable(['Tipo de efectivo','Importe'],counts.map(x=>x.amount!==undefined?[x.label,money(x.amount)]:[money(x.value)+' × '+x.qty,money(x.value*x.qty)])):'<p class="muted">Desglose no registrado.</p>'}
function cashReport(id){const s=cashSessions.find(x=>x.id===id);if(!s||role==='Barbero')return;const rows=s.movementSnapshot||sessionMoves(id),methods=['Efectivo','QR (registro manual)','Transferencia (registro manual)'];const net=type=>round(rows.filter(m=>m.type===type).reduce((n,m)=>n+m.amount,0)),expected=round(s.opening+net('Efectivo')),digital=round(net(methods[1])+net(methods[2]));saveReport('arqueo-'+id,s.closed?'Arqueo y cierre de caja':'Estado de caja abierta','Caja '+id+' · '+(s.closed?'Cierre registrado':'Informe provisional: aún no se cerró'),reportFacts([['Apertura',stamp(s.openedAt)],['Cierre',s.closed?stamp(s.closedAt):'Caja abierta'],['Fondo inicial',money(s.opening)],['Efectivo esperado',money(s.closed?s.expected:expected)],['Efectivo contado',s.closed?money(s.counted):'Pendiente de arqueo'],['Diferencia en efectivo',s.closed?differenceLabel(s.diff):'Sin cierre']])+`<p>Apertura registrada por: <b>${esc(s.openedBy||'No registrado')}</b> · Cierre: <b>${esc(s.closedBy||'Pendiente / no registrado')}</b></p><h2>Resumen por medio de pago</h2>`+reportTable(['Medio','Entradas','Salidas','Neto'],methods.map(type=>{const list=rows.filter(m=>m.type===type);return [type,money(list.filter(m=>m.amount>0).reduce((n,m)=>n+m.amount,0)),money(-list.filter(m=>m.amount<0).reduce((n,m)=>n+m.amount,0)),money(net(type))]}))+reportFacts([['Total neto de movimientos',money(rows.reduce((n,m)=>n+m.amount,0))],['Total del negocio sin propinas digitales pendientes (incluye fondo)',money(expected+digital-rows.filter(m=>m.kind==='tip'&&m.type!=='Efectivo').reduce((n,m)=>n+m.amount,0))],['Fondo + efectivo neto + digitales',money(expected+digital)],['Efectivo contado + digitales registrados',s.closed?money(s.counted+digital):'Pendiente de cierre']])+`<div class="note">El fondo inicial no es una venta. Efectivo esperado = fondo inicial + entradas en efectivo − salidas en efectivo. Los totales digitales son registros manuales; sumarlos al efectivo no verifica que hayan llegado al banco.</div><h2>Pagos digitales calculados desde los movimientos</h2>`+reportTable(['Medio','Registrado','Revisado manualmente','Resultado'],(s.digital||methods.slice(1).map(type=>({type,expected:net(type),reviewed:null}))).map(d=>[d.type,money(d.expected),d.reviewed===null?'Sin revisar':money(d.reviewed),d.reviewed===null?'Pendiente':differenceLabel(d.diff)]))+tipCloseReport(rows)+`<h2>Efectivo de apertura</h2>`+countsReport(s.openingCounts)+`<h2>Efectivo de cierre</h2>`+countsReport(s.closingCounts)+`<h2>Observaciones</h2><p>Apertura: ${esc(s.openingNote||'Sin observaciones')}</p><p>Cierre: ${esc(s.reason||'Sin observaciones registradas')}</p><h2>Detalle de todos los movimientos (${rows.length})</h2>`+movementReport(rows)+`<div class="signatures"><div>Responsable de caja · firma</div><div>Revisado por · firma</div></div>`)}
function receipt(id){const a=appointments.find(x=>x.id===id);if(!a||role==='Barbero')return;saveReport('comprobante-'+id,'Comprobante interno','Cita '+id+' · No es factura fiscal',reportFacts([['Cliente',name(a)],['Profesional',barbers[a.barber]],['Atención',displayDate(a.date)+' · '+timeLabel(a.time)],['Total del servicio',money(a.price)],['Abonado neto',money(a.paid)],['Saldo pendiente del servicio',money(a.price-a.paid)],['Propinas',money(movements.filter(m=>m.appointment===id&&m.kind==='tip').reduce((n,m)=>n+m.amount,0))],['Total recibido (servicio + propinas)',money(movements.filter(m=>m.appointment===id).reduce((n,m)=>n+m.amount,0))]])+`<h2>Servicio</h2><p>${esc(a.serviceName)}</p><p>Estado de atención: ${esc(a.status)}</p><h2>Pagos y devoluciones</h2>`+movementReport(movements.filter(m=>m.appointment===id)))}
function appointmentReport(rows){return reportTable(['Fecha / hora','Cliente','Profesional / servicio','Estado','Total','Abonado','Saldo'],rows.map(a=>[displayDate(a.date)+' '+timeLabel(a.time),name(a),barbers[a.barber]+' / '+a.serviceName,a.status,money(a.price),money(a.paid),money(a.price-a.paid)]))}
function statsReport(){if(role==='Barbero')return;const m=metrics(reportFrom,reportTo);saveReport('estadisticas-'+reportFrom+'-'+reportTo,'Informe de actividad',displayDate(reportFrom)+' al '+displayDate(reportTo)+' · Profesional: '+(filter==='Todos'?'Todo el equipo':barbers[+filter])+' · Servicio: '+(serviceFilter==='Todos'?'Todos':services[+serviceFilter]?.name||serviceFilter),reportFacts([['Cobrado neto de servicios',money(m.income)],['Atenciones completadas',m.done.length],['Clientes atendidos',m.clients],['Cancelaciones',m.cancel],['Ausencias',m.absent],['Descuentos en atenciones',money(m.discount)]])+`<div class="note">Cobrado neto por fecha del movimiento, descontando devoluciones. No incluye fondo inicial ni ventas de productos. Los ingresos no equivalen a ganancias.</div><h2>Citas del período</h2>`+appointmentReport(m.rows))}
function exportDemo(){if(role!=='Propietario')return;saveReport('registros-barbe-shop','Registro general de operaciones','Registros de la barbería',reportFacts([['Clientes',clients.length],['Citas',appointments.length],['Movimientos',movements.length]])+`<h2>Citas</h2>`+appointmentReport(appointments)+`<h2>Movimientos de caja</h2>`+movementReport(movements)+`<h2>Clientes</h2>`+reportTable(['Nombre','Teléfono','Notas'],clients.map(c=>[c.name,c.phone||'No registrado',c.notes||'—']))+`<h2>Inventario actual</h2>`+reportTable(['Producto','Precio unitario','Existencias'],inventory.map(p=>[p.name,money(p.price),stock(p.id)]))+`<h2>Aperturas y cierres</h2>`+reportTable(['Caja','Apertura','Fondo','Cierre','Contado','Diferencia'],cashSessions.map(s=>[s.id,stamp(s.openedAt),money(s.opening),s.closed?stamp(s.closedAt):'Abierta',s.closed?money(s.counted):'—',s.closed?differenceLabel(s.diff):'—']))+`<h2>Promociones</h2>`+reportTable(['Nombre','Vigencia','Horario','Beneficio','Estado'],promos.map(p=>[p.name,p.from+' a '+p.to,p.start+'–'+p.end,promoDescription(p),promoState(p)]))+`<h2>Salarios mensuales configurados</h2>`+reportTable(['Barbero','Salario mensual'],barbers.map((b,i)=>[b,monthlySalaries[i]===undefined?'Sin configurar':money(monthlySalaries[i])]))+`<h2>Liquidaciones anteriores</h2>`+reportTable(['Fecha','Profesional','Importe'],settlements.map(x=>[x.date,barbers[x.barber],money(x.total)]))+`<h2>Actividad registrada</h2>`+reportTable(['Fecha / hora','Acción','Perfil'],historyLog.map(x=>[stamp(x.time),x.title,x.role])))}

function qrCloseSummary(id,counted){const rows=sessionMoves(id).filter(m=>m.type==='QR (registro manual)'),received=round(rows.filter(m=>m.amount>0).reduce((n,m)=>n+m.amount,0)),returned=round(-rows.filter(m=>m.amount<0).reduce((n,m)=>n+m.amount,0)),net=round(received-returned),transfer=methodNet(id,'Transferencia (registro manual)');return `<div class="quote"><span>QR cobrado en esta caja · automático</span><strong>${money(net)}</strong><small>Cobros: ${money(received)} · Devoluciones: ${money(returned)} · ${rows.length} movimientos</small></div><div class="quote"><span>Total de cierre: efectivo contado + QR${transfer?' + otros pagos registrados':''}</span><strong>${money(round(counted+net+transfer))}</strong><small>Propinas digitales pendientes: ${money(sessionMoves(id).filter(m=>m.kind==='tip'&&m.type!=='Efectivo').reduce((n,m)=>n+m.amount,0))}<br>Total del negocio, descontando propinas digitales: ${money(round(counted+net+transfer-sessionMoves(id).filter(m=>m.kind==='tip'&&m.type!=='Efectivo').reduce((n,m)=>n+m.amount,0)))}<br>Billetes y monedas: ${money(counted)} · QR: ${money(net)}${transfer?' · Otros pagos registrados: '+money(transfer):''}<br>Incluye el fondo inicial que permanece en efectivo. El faltante o sobrante se calcula comparando el efectivo contado con el esperado.</small></div>`}


function salaryForm(i){if(role!=='Propietario')return;modal('Salario mensual · '+barbers[i],field('Salario mensual (Bs)',input('salary','number',monthlySalaries[i]??'','required min="0" max="200000000" step="0.01"'))+'<p>El salario es fijo. Las propinas se muestran por separado y no modifican este importe.</p>',f=>{const amount=Number(f.get('salary'));if(f.get('salary')===''||!Number.isFinite(amount)||amount<0||amount>200000000||Math.abs(amount*100-Math.round(amount*100))>0.00001)throw Error('Indica un salario válido con hasta dos decimales.');const totals={};salaryDeductions.filter(d=>d.barber===i).forEach(d=>totals[d.month]=(totals[d.month]||0)+d.amount);if(Object.values(totals).some(n=>round(n)>amount))throw Error('El salario no puede ser menor que los descuentos ya registrados.');monthlySalaries[i]=amount;logAction('Salario mensual · '+barbers[i]+' · '+money(amount));finish('Salario mensual guardado')})}
function salaryPage(){if(role!=='Propietario')return;const tips=movements.filter(m=>m.kind==='tip'&&m.date.slice(0,7)===salaryMonth),deductions=salaryDeductions.filter(d=>d.month===salaryMonth);$('#main').innerHTML=heading('Salarios y propinas','Control mensual de salarios, descuentos y propinas.')+`<div class="toolbar"><label>Mes <input type="month" value="${esc(salaryMonth)}" onchange="if(this.value){salaryMonth=this.value;salaryPage()}"></label></div><div class="cards">${barbers.map((b,i)=>{const cut=round(deductions.filter(d=>d.barber===i).reduce((n,d)=>n+d.amount,0)),base=monthlySalaries[i];return `<article class="card"><h2>${esc(b)}</h2>${schedules[i].retired?'<span class="badge">Retirado del equipo</span>':''}<p>Salario mensual: <b>${base===undefined?'Sin configurar':money(base)}</b></p><p>Descuentos del mes: <b>${money(cut)}</b></p><p>Salario neto a pagar</p><strong class="price">${base===undefined?'Sin configurar':money(round(base-cut))}</strong><p>Propinas del mes: <b>${money(tips.filter(m=>m.barber===i).reduce((n,m)=>n+m.amount,0))}</b></p><div class="buttons"><button onclick="salaryForm(${i})">Editar salario mensual</button><button onclick="deductionForm(${i})">Registrar descuento</button></div></article>`}).join('')||'<p>Agrega barberos en Equipo para configurar sus salarios.</p>'}</div><p class="notice">Salario neto = salario mensual menos descuentos del mes. Las propinas se muestran por separado. Registrar un descuento no retira dinero de caja ni registra un pago de salario.</p><h2 class="subhead">Descuentos del mes</h2>${reportTable(['Fecha','Barbero','Motivo','Descuento'],deductions.map(d=>[d.date,barbers[d.barber],d.reason,money(d.amount)]))}<h2 class="subhead">Propinas del mes</h2>${reportTable(['Fecha','Cliente','Barbero','Propina','Medio de pago'],tips.map(m=>[m.date,m.clientName,m.barberName,money(m.amount),m.type]))}`}
function deductionForm(i){if(role!=='Propietario')return;modal('Descuento · '+barbers[i],field('Mes del salario',input('month','month',salaryMonth,'required'))+field('Fecha del descuento',input('date','date',today,'required'))+field('Monto del descuento (Bs)',input('amount','number','','required min="0.01" max="200000000" step="0.01"'))+field('Motivo',input('reason','text','','required maxlength="240"'))+'<p>Revisa el monto y el motivo antes de guardar. Quedarán registrados en el historial salarial.</p>',f=>{const amount=Number(f.get('amount')),month=String(f.get('month')||''),reason=String(f.get('reason')||'').trim(),date=String(f.get('date')||'');if(!reason||reason.length>240||!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)||!Number.isFinite(amount)||amount<=0||Math.abs(amount*100-Math.round(amount*100))>0.00001)throw Error('Revisa el mes, monto y motivo del descuento.');const total=salaryDeductions.filter(d=>d.barber===i&&d.month===month).reduce((n,d)=>n+d.amount,0);if(monthlySalaries[i]===undefined)throw Error('Configura primero el salario mensual.');if(round(total+amount)>monthlySalaries[i])throw Error('Los descuentos del mes no pueden superar el salario.');salaryDeductions.push({id:uuidNumber(),barber:i,month,date,amount,reason,createdAt:new Date().toISOString(),actor:role});salaryMonth=month;logAction('Descuento salarial · '+barbers[i]+' · '+money(amount));finish('Descuento registrado')})}
function retireBarber(i){if(role!=='Propietario'||!schedules[i]||schedules[i].retired)return;modal('Eliminar barbero del equipo',`<p>Se retirará a <b>${esc(barbers[i])}</b> de las nuevas citas. Su historial de servicios, cobros y salarios se conservará.</p><label class="inlinecheck"><input type="checkbox" name="confirm" required>Confirmo que este barbero deja de trabajar aquí.</label>`,f=>{if(!f.has('confirm'))throw Error('Confirma la eliminación del equipo.');if(appointments.some(a=>a.barber===i&&a.date>=today&&!['Completada','Cancelada','No asistió'].includes(a.status)))throw Error('Reprograma o cancela primero las citas pendientes de este barbero.');schedules[i]={...schedules[i],active:false,retired:true,retiredAt:new Date().toISOString()};logAction('Barbero retirado · '+barbers[i]);finish('Barbero eliminado del equipo')})}


function cashTipsPending(id){const rows=sessionMoves(id),paid=new Set(rows.filter(m=>m.kind==='tip-payout').flatMap(m=>m.tipIds||[]));return rows.filter(m=>m.kind==='tip'&&m.type==='Efectivo'&&!paid.has(m.id))}
function tipCloseReport(rows){const tips=rows.filter(m=>m.kind==='tip');if(!tips.length)return '';const ids=[...new Set(tips.map(m=>m.barber))];const cash=round(tips.filter(m=>m.type==='Efectivo').reduce((n,m)=>n+m.amount,0)),digital=round(tips.filter(m=>m.type!=='Efectivo').reduce((n,m)=>n+m.amount,0)),paid=round(-rows.filter(m=>m.kind==='tip-payout').reduce((n,m)=>n+m.amount,0));return '<h2>Propinas por barbero</h2>'+reportTable(['Barbero','Efectivo','QR','Transferencia','Total'],ids.map(i=>{const list=tips.filter(m=>m.barber===i),sum=type=>money(list.filter(m=>m.type===type).reduce((n,m)=>n+m.amount,0));return [list[0].barberName,sum('Efectivo'),sum('QR (registro manual)'),sum('Transferencia (registro manual)'),money(list.reduce((n,m)=>n+m.amount,0))]}))+`<p>Propinas en efectivo: <b>${money(cash)}</b> · Entregadas desde caja: <b>${money(paid)}</b><br>Propinas digitales pendientes de entrega: <b>${money(digital)}</b>. Se separan del importe del negocio; no se descuentan del efectivo.</p>`}
function payCashTipsAtClose(id,at){const tips=cashTipsPending(id);for(const barber of new Set(tips.map(m=>m.barber))){const list=tips.filter(m=>m.barber===barber),amount=round(list.reduce((n,m)=>n+m.amount,0));movements.push({id:uuidNumber(),at,actor:role,date:localCashDate(),amount:-amount,type:'Efectivo',kind:'tip-payout',session:id,barber,barberName:list[0].barberName,tipIds:list.map(m=>m.id),note:'Entrega de propinas · Barbero '+list[0].barberName});}}

const dayNames=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function scheduleDay(s,d){return s.weekly?.[d]||{enabled:s.days.includes(d),start:s.start,end:s.end,breakStart:s.breakStart,breakEnd:s.breakEnd,hasBreak:true}}
function weeklySummary(s){return '<div class="weekly-summary">'+[1,2,3,4,5,6,0].map(d=>{const h=scheduleDay(s,d);return `<p><b>${dayNames[d]}</b> · ${h.enabled?esc(h.start)+'–'+esc(h.end)+(h.hasBreak?'<small>Descanso '+esc(h.breakStart)+'–'+esc(h.breakEnd)+'</small>':''):'Libre'}</p>`}).join('')+'</div>'}
</script><script>/* Los sellos se calculan desde las citas guardadas, nunca desde clics o recargas. */
function loyaltyVisits(id,rows=appointments){return [...new Set(rows.filter(a=>a.client===id&&a.status==='Completada').map(a=>a.id))].length}
function loyaltyMarkup(id,celebrate=false){const c=clients.find(c=>c.id===id);if(!c)return '';const count=Math.min(9,loyaltyVisits(id)),logo=document.querySelector('.barber-logo')?.getAttribute?.('src')||'';return `<section class="loyalty-card ${count===9?'loyalty-won':''}" aria-label="Tarjeta de fidelización de ${esc(c.name)}">${celebrate?`<div class="loyalty-confetti" aria-hidden="true">${Array.from({length:36},(_,i)=>`<i style="--x:${(i*31)%100}%;--delay:${i%9/10}s;--spin:${i%2?360:-360}deg"></i>`).join('')}</div>`:''}<div class="loyalty-brand">${logo?`<img src="${esc(logo)}" alt="Logo oficial de Barak">`:''}<span>BARAK<br><small>BARBERÍA</small></span></div><p class="loyalty-label">EL ESTILO TIENE SU RECOMPENSA</p><h2>${esc(c.name)}</h2><p class="loyalty-subtitle">Tu tarjeta de fidelización · 9 visitas, un corte de regalo</p><div class="loyalty-stamps">${Array.from({length:9},(_,i)=>`<div class="loyalty-stamp ${i<count?'filled':''}" aria-label="Visita ${i+1}: ${i<count?'completada':'pendiente'}"><span>${i<count?'✂':String(i+1).padStart(2,'0')}</span><small>${i<count?'VISITA':'BARAK'}</small></div>`).join('')}</div><div class="loyalty-bottom"><strong>${count===9?'¡Ganaste un corte gratis en nuestra barbería!':`${count} de 9 visitas completadas`}</strong><p>${count===9?'Gracias por elegirnos. Tu fidelidad merece el mejor estilo.':'Cada atención completada suma un sello. Las reservas y cancelaciones no cuentan.'}</p></div><span class="loyalty-number">CLIENTE ${c.id}</span></section>`}
function loyaltyCard(id,celebrate=false){modal(celebrate?'¡Un premio para ti!':'Tarjeta de fidelización',loyaltyMarkup(id,celebrate)+loyaltyActions(id),()=>closeModal())}
function loyaltyAfterSave(before,after){const winner=after.clients.find(c=>loyaltyVisits(c.id,before.appointments)<9&&loyaltyVisits(c.id,after.appointments)>=9);if(winner){loyaltyCard(winner.id,true);return}const created=after.clients.find(c=>!before.clients.some(old=>old.id===c.id));if(created)loyaltyCard(created.id)}

function loyaltyPhone(value){let phone=String(value||'').replace(/\D/g,'');if(phone.startsWith('00'))phone=phone.slice(2);if(phone.length===8)phone='591'+phone;return /^[1-9]\d{9,14}$/.test(phone)?phone:''}
function loyaltyLink(id){const c=clients.find(c=>c.id===id);if(!c)return '';const url=new URL('loyalty-card.html',window.location.href);url.hash=encodeURIComponent(JSON.stringify({name:c.name,visits:Math.min(9,loyaltyVisits(id)),date:new Date().toISOString().slice(0,10)}));return url.href}
function loyaltyWhatsAppUrl(id){const c=clients.find(c=>c.id===id),phone=loyaltyPhone(c?.phone);if(!phone)return '';const count=Math.min(9,loyaltyVisits(id));return 'https://wa.me/'+phone+'?text='+encodeURIComponent('Hola '+c.name+' ✂️\nTu tarjeta de Barak: '+count+' de 9 visitas.\n'+(count===9?'¡Ganaste un corte gratis!':'Completa tus 9 visitas y gana un corte gratis.')+'\nMira tu tarjeta: '+loyaltyLink(id))}
function loyaltyActions(id){const url=loyaltyWhatsAppUrl(id);return '<div class="loyalty-actions">'+(url?'<a class="primary" target="_blank" rel="noopener noreferrer" href="'+esc(url)+'">Enviar por WhatsApp</a>':'<p>Agrega un teléfono válido al cliente para enviar su tarjeta por WhatsApp.</p>')+'</div><p class="loyalty-share-note">Abre el chat del cliente con su tarjeta lista para enviar. El enlace muestra los sellos al momento de compartirlo.</p>'}
</script><script>/* Validación compartida: navegador y servidor. Importes expresados en Bs. */

 function validMoney(value,label,nonnegative=true){if(!cash(value)||(nonnegative&&value<0))fail('Importe no válido: '+label)}
 function validateState(s){
   if(!s||s.schema!==1)fail('Versión de datos no compatible.');safeTree(s);
   for(const key of arrays)if(!Array.isArray(s[key]))fail('Falta la colección '+key);
   if(!integer(s.serial,1)||typeof s.cashOpen!=='boolean'||typeof s.closed!=='boolean'||!s.productRates||!s.availabilityHistory)fail('Estado incompleto.');
   for(const key of ['clients','appointments','movements','promos','cashSessions','blocks','inventory','stockLedger','settlements'])unique(s[key],key);
   if(s.barbers.some(x=>typeof x!=='string'||!x.trim()||x.length>80)||s.schedules.length!==s.barbers.length)fail('Revisa el equipo.');
   s.schedules.forEach(x=>{if(!x||!['start','end','breakStart','breakEnd'].every(k=>time(x[k]))||x.start>=x.end||x.breakStart<x.start||x.breakEnd>x.end||x.breakStart>=x.breakEnd||!Array.isArray(x.days)||x.days.some(d=>!integer(d)||d>6)||typeof x.active!=='boolean')fail('Horario no válido.')});
   for(const sch of s.schedules)if(sch.weekly!==undefined){
     if(!sch.weekly||Array.isArray(sch.weekly)||Object.keys(sch.weekly).length!==7)fail('Horario semanal incompleto.');
     for(let d=0;d<7;d++){const h=sch.weekly[d];if(!h||typeof h.enabled!=='boolean'||typeof h.hasBreak!=='boolean'||!['start','end','breakStart','breakEnd'].every(k=>time(h[k]))||h.enabled&&(h.start>=h.end||h.hasBreak&&(h.breakStart<h.start||h.breakEnd>h.end||h.breakStart>=h.breakEnd))||sch.days.includes(d)!==h.enabled)fail('Horario diario no válido.');}
   }
   s.services.forEach(x=>{validMoney(x.price,'servicio');if(typeof x.name!=='string'||!x.name.trim()||!integer(x.duration,5)||x.duration>480||!integer(x.prep)||x.prep>60)fail('Servicio no válido.')});
   s.clients.forEach(x=>{if(typeof x.name!=='string'||!x.name.trim()||x.name.length>80||typeof x.phone!=='string')fail('Cliente no válido.')});
   const sessions=new Map(s.cashSessions.map(x=>[x.id,x])),clients=new Set(s.clients.map(x=>x.id));
   s.appointments.forEach(a=>{
     if(!clients.has(a.client)||!integer(a.barber)||!s.barbers[a.barber]||!integer(a.service)||!s.services[a.service]||!date(a.date)||!time(a.time)||!statuses.includes(a.status)||!integer(a.duration,5)||a.duration>480||!integer(a.prep)||a.prep>60)fail('Cita no válida.');

   });
   const bookings=s.appointments.filter(a=>!['Cancelada','No asistió'].includes(a.status)).slice().sort((a,b)=>a.date.localeCompare(b.date)||a.barber-b.barber||a.time.localeCompare(b.time));
   for(let i=1;i<bookings.length;i++){const a=bookings[i-1],b=bookings[i];if(a.date===b.date&&a.barber===b.barber&&minutes(a.time)+a.duration+a.prep>minutes(b.time))fail('Existen citas solapadas.');}
   s.movements.forEach(m=>{validMoney(m.amount,'movimiento',false);if(!m.amount||!methods.includes(m.type)||!sessions.has(m.session)||!date(m.date))fail('Movimiento de caja no válido.');if(m.appointment&&!s.appointments.some(a=>a.id===m.appointment))fail('Pago sin cita.');if(m.kind==='tip'){if(m.amount<=0||!integer(m.barber)||!s.barbers[m.barber]||!m.appointment||!clients.has(m.client)||typeof m.clientName!=='string'||!m.clientName.trim()||m.clientName.length>80||typeof m.barberName!=='string'||!m.barberName.trim())fail('Propina no válida.');}if(m.kind==='sale'){if(!integer(m.quantity,1)||!s.inventory.some(p=>p.id===m.product)||!integer(m.barber)||!s.barbers[m.barber])fail('Venta no válida.');validMoney(m.unitPrice,'producto');validMoney(m.commissionAmount,'comisión');if(!cash(m.commissionRate)||m.commissionRate<0||m.commissionRate>100||cents(m.amount)!==cents(m.unitPrice*m.quantity)||cents(m.commissionAmount)!==Math.round(m.amount*m.commissionRate))fail('Cálculo de venta no válido.');}});
   const deliveredTips=new Set();
   for(const payout of s.movements.filter(m=>m.kind==='tip-payout')){
     if(payout.type!=='Efectivo'||payout.amount>=0||!integer(payout.barber)||!s.barbers[payout.barber]||payout.appointment||!Array.isArray(payout.tipIds)||!payout.tipIds.length||!sessions.get(payout.session)?.closed)fail('Entrega de propinas no válida.');
     let total=0;for(const id of payout.tipIds){const tip=s.movements.find(m=>m.id===id);if(deliveredTips.has(id)||!tip||tip.kind!=='tip'||tip.type!=='Efectivo'||tip.barber!==payout.barber||tip.session!==payout.session)fail('Propina ya entregada o referencia incorrecta.');deliveredTips.add(id);total+=cents(tip.amount);}
     if(cents(-payout.amount)!==total)fail('La entrega no coincide con las propinas del barbero.');
   }
   s.cashSessions.forEach(c=>{validMoney(c.opening,'apertura');if(!date(c.date))fail('Fecha de caja no válida.');if(c.closed){const expected=cents(c.opening)+s.movements.filter(m=>m.session===c.id&&m.type==='Efectivo').reduce((n,m)=>n+cents(m.amount),0);validMoney(c.counted,'conteo');if(cents(c.expected)!==expected||cents(c.diff)!==cents(c.counted)-expected)fail('El cierre no coincide con sus movimientos.');if(c.diff&&!String(c.reason||'').trim())fail('Falta explicar la diferencia de caja.');}});

     for(const [key,total] of [['openingCounts',c.opening],['closingCounts',c.counted]])if(c[key]){

     }

     if(!Array.isArray(s.salaryDeductions))fail('Descuentos no válidos.');unique(s.salaryDeductions,'descuentos');
     for(const d of s.salaryDeductions){validMoney(d.amount,'descuento');if(d.amount<=0||!integer(d.barber)||!s.barbers[d.barber]||!/^\d{4}-(0[1-9]|1[0-2])$/.test(d.month)||!date(d.date)||typeof d.reason!=='string'||!d.reason.trim()||d.reason.length>240)fail('Descuento salarial no válido.');}
   }

 }
 function validateTransition(previous,next){
